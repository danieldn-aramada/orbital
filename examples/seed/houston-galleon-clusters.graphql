# Seed clusters + nodes for the houston-galleon data center.
# Source: Cluster Resource Tracking (4).xlsx, sheet 'Houston-V3'.
# Servers referenced here must already be in houston-galleon.graphql.

mutation SeedClusters {
  # 1. IPAddress nodes — control-plane, tinkerbell, and k8s-node IPs.
  addIPAddress(input: [
    { orbId: "houston:10.10.0.101" type: "ipv4" address: "10.10.0.101" role: "k8s_api" namespace: "houston" version: 1 createdBy: "admin@armada.ai" createdAt: "2026-06-18T00:00:00Z" },
    { orbId: "houston:10.10.0.102" type: "ipv4" address: "10.10.0.102" role: "tinkerbell" namespace: "houston" version: 1 createdBy: "admin@armada.ai" createdAt: "2026-06-18T00:00:00Z" },
    { orbId: "houston:10.10.0.103" type: "ipv4" address: "10.10.0.103" role: "k8s_api" namespace: "houston" version: 1 createdBy: "admin@armada.ai" createdAt: "2026-06-18T00:00:00Z" },
    { orbId: "houston:10.10.0.11" type: "ipv4" address: "10.10.0.11" role: "k8s_node" namespace: "houston" version: 1 createdBy: "admin@armada.ai" createdAt: "2026-06-18T00:00:00Z" },
    { orbId: "houston:10.10.0.112" type: "ipv4" address: "10.10.0.112" role: "k8s_node" namespace: "houston" version: 1 createdBy: "admin@armada.ai" createdAt: "2026-06-18T00:00:00Z" },
    { orbId: "houston:10.10.0.117" type: "ipv4" address: "10.10.0.117" role: "k8s_node" namespace: "houston" version: 1 createdBy: "admin@armada.ai" createdAt: "2026-06-18T00:00:00Z" },
    { orbId: "houston:10.10.0.118" type: "ipv4" address: "10.10.0.118" role: "k8s_node" namespace: "houston" version: 1 createdBy: "admin@armada.ai" createdAt: "2026-06-18T00:00:00Z" },
    { orbId: "houston:10.10.0.123" type: "ipv4" address: "10.10.0.123" role: "k8s_node" namespace: "houston" version: 1 createdBy: "admin@armada.ai" createdAt: "2026-06-18T00:00:00Z" },
    { orbId: "houston:10.10.0.124" type: "ipv4" address: "10.10.0.124" role: "k8s_node" namespace: "houston" version: 1 createdBy: "admin@armada.ai" createdAt: "2026-06-18T00:00:00Z" },
    { orbId: "houston:10.10.0.125" type: "ipv4" address: "10.10.0.125" role: "k8s_node" namespace: "houston" version: 1 createdBy: "admin@armada.ai" createdAt: "2026-06-18T00:00:00Z" },
    { orbId: "houston:10.10.0.15" type: "ipv4" address: "10.10.0.15" role: "k8s_node" namespace: "houston" version: 1 createdBy: "admin@armada.ai" createdAt: "2026-06-18T00:00:00Z" },
    { orbId: "houston:10.10.0.21" type: "ipv4" address: "10.10.0.21" role: "k8s_node" namespace: "houston" version: 1 createdBy: "admin@armada.ai" createdAt: "2026-06-18T00:00:00Z" },
    { orbId: "houston:10.10.0.22" type: "ipv4" address: "10.10.0.22" role: "k8s_node" namespace: "houston" version: 1 createdBy: "admin@armada.ai" createdAt: "2026-06-18T00:00:00Z" },
    { orbId: "houston:10.10.0.25" type: "ipv4" address: "10.10.0.25" role: "k8s_node" namespace: "houston" version: 1 createdBy: "admin@armada.ai" createdAt: "2026-06-18T00:00:00Z" },
    { orbId: "houston:10.10.0.9" type: "ipv4" address: "10.10.0.9" role: "k8s_node" namespace: "houston" version: 1 createdBy: "admin@armada.ai" createdAt: "2026-06-18T00:00:00Z" }
  ], upsert: true) {
    numUids
  }

  # 2. EKSA management clusters (workload clusters reference these).
  mgmt: addEksaKubernetesCluster(input: [
    {
      orbId: "houston:g2-m", name: "g2-m", namespace: "houston", version: 1, createdBy: "admin@armada.ai", createdAt: "2026-06-18T00:00:00Z", clusterType: "management", provider: "eksa", cni: "cilium", environment: "prod", dataCenter: { orbId: "houston:houston-galleon" version: 1 }, controlPlaneEndpoint: { orbId: "houston:10.10.0.101" version: 1 }, tinkerbellIP: { orbId: "houston:10.10.0.102" version: 1 },
      nodes: [
