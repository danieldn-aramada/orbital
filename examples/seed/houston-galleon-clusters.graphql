          { orbId: "houston:g2-cp6-24", namespace: "houston", version: 1, createdBy: "admin@armada.ai", createdAt: "2026-06-18T00:00:00Z", name: "g2-cp6-24", ipv4: { orbId: "houston:10.10.0.124" version: 1 }, gpu: false, role: "control_plane", server: { orbId: "houston:1B22FZ3" version: 1 } },
          { orbId: "houston:g2-cp5-22", namespace: "houston", version: 1, createdBy: "admin@armada.ai", createdAt: "2026-06-18T00:00:00Z", name: "g2-cp5-22", ipv4: { orbId: "houston:10.10.0.22" version: 1 }, gpu: false, role: "control_plane", server: { orbId: "houston:6B22FZ3" version: 1 } },
          { orbId: "houston:g2-wk5-15", namespace: "houston", version: 1, createdBy: "admin@armada.ai", createdAt: "2026-06-18T00:00:00Z", name: "g2-wk5-15", ipv4: { orbId: "houston:10.10.0.15" version: 1 }, gpu: false, role: "worker", server: { orbId: "houston:CB52FZ3" version: 1 } }
        ]
    }
  ], upsert: true) {
    numUids
  }

  # 3. EKSA workload clusters — each links back to its management.
  workload: addEksaKubernetesCluster(input: [
    {
      orbId: "houston:g2-w1", name: "g2-w1", namespace: "houston", version: 1, createdBy: "admin@armada.ai", createdAt: "2026-06-18T00:00:00Z", clusterType: "workload", provider: "eksa", cni: "cilium", environment: "prod", dataCenter: { orbId: "houston:houston-galleon" version: 1 }, controlPlaneEndpoint: { orbId: "houston:10.10.0.103" version: 1 }, tinkerbellIP: { orbId: "houston:10.10.0.102" version: 1 }, managementCluster: { orbId: "houston:g2-m" version: 1 },
      nodes: [
          { orbId: "houston:g2-cp6-25", namespace: "houston", version: 1, createdBy: "admin@armada.ai", createdAt: "2026-06-18T00:00:00Z", name: "g2-cp6-25", ipv4: { orbId: "houston:10.10.0.125" version: 1 }, gpu: false, role: "control_plane", server: { orbId: "houston:2B22FZ3" version: 1 } },
