          { orbId: "houston:g2-cp5-25", namespace: "houston", version: 1, createdBy: "admin@armada.ai", createdAt: "2026-06-18T00:00:00Z", name: "g2-cp5-25", ipv4: { orbId: "houston:10.10.0.25" version: 1 }, gpu: false, role: "control_plane", server: { orbId: "houston:5B22FZ3" version: 1 } },
          { orbId: "houston:g2-wk6-17", namespace: "houston", version: 1, createdBy: "admin@armada.ai", createdAt: "2026-06-18T00:00:00Z", name: "g2-wk6-17", ipv4: { orbId: "houston:10.10.0.117" version: 1 }, gpu: false, role: "worker", server: { orbId: "houston:6B52FZ3" version: 1 } },
          { orbId: "houston:g2-wk6-18", namespace: "houston", version: 1, createdBy: "admin@armada.ai", createdAt: "2026-06-18T00:00:00Z", name: "g2-wk6-18", ipv4: { orbId: "houston:10.10.0.118" version: 1 }, gpu: false, role: "worker", server: { orbId: "houston:8B52FZ3" version: 1 } },
          { orbId: "houston:g2-gpu-wk6-12", namespace: "houston", version: 1, createdBy: "admin@armada.ai", createdAt: "2026-06-18T00:00:00Z", name: "g2-gpu-wk6-12", ipv4: { orbId: "houston:10.10.0.112" version: 1 }, gpu: true, role: "worker", server: { orbId: "houston:6PJ1FZ3" version: 1 } },
          { orbId: "houston:g2-gpu-wk5-09", namespace: "houston", version: 1, createdBy: "admin@armada.ai", createdAt: "2026-06-18T00:00:00Z", name: "g2-gpu-wk5-09", ipv4: { orbId: "houston:10.10.0.9" version: 1 }, gpu: true, role: "worker", server: { orbId: "houston:7PJ1FZ3" version: 1 } },
          { orbId: "houston:g2-gpu-wk5-11", namespace: "houston", version: 1, createdBy: "admin@armada.ai", createdAt: "2026-06-18T00:00:00Z", name: "g2-gpu-wk5-11", ipv4: { orbId: "houston:10.10.0.11" version: 1 }, gpu: true, role: "worker", server: { orbId: "houston:4PJ1FZ3" version: 1 } }
        ]
    }
  ], upsert: true) {
    numUids
  }
}
