# Seed clusters + nodes for the colo-galleon data center.
# Source: Cluster Resource Tracking (4).xlsx, sheet 'Colo -V3'.
# Servers referenced here must already be in colo-galleon.graphql.

mutation SeedClusters {
  # 0. Reset backup tree for clusters that declare one inline below.
  #
  # DGraph's `add{Type} upsert:true` only INSERTS new entities; it does not
  # overwrite scalar fields on existing entities referenced by orbId. So when
  # a seed file changes (e.g. updating a backup schedule), re-running `make
  # seed` would leave the OLD values in place — the upsert no-ops on existing
  # orbIds. Deleting the backup sub-tree before re-add makes the seed truly
  # idempotent. Targeted only at backup entities (small blast radius); other
  # ConfigItems remain upsert-only because they may legitimately diverge
  # from seed via operator edits in dev environments.
  deleteEtcdBackup(filter: {orbId: {in: ["colo:dev-main-etcd-backup"]}}) { numUids }
  deleteVeleroBackup(filter: {orbId: {in: ["colo:dev-main-velero-backup"]}}) { numUids }
  deleteS3Sync(filter: {orbId: {in: ["colo:dev-main-s3sync"]}}) { numUids }
  deleteClusterBackup(filter: {orbId: {in: ["colo:dev-main-backup"]}}) { numUids }

