# Orbital view configuration.
#
# TWO NOUNS
#   pages:  a URL + a menu entry + a detail layout.  THE TOP LEVEL IS THE MENU.
#             subgraph: the entities connected to this one that the page
#                       SHOWS, EDITS, AUDITS and DELETES. One declaration, four
#                       consumers. Order is display order.
#   types:  how a type renders WHEREVER it renders. Declared once, because
#           IPAddress appears on four pages and NetworkInterface on three.
#           INHERITS along the schema's interfaces.
#
# THE SUBGRAPH IS DECLARED, NEVER DERIVED
#   GraphQL has no concept of ownership; `!` means non-null and nothing more.
#   What a page deletes is what it lists here — a path, one or more hops
#   (`storageControllers.storageDevices`). An entity not listed is not in the
#   subgraph, whatever the schema says about it.
#   ⚠️ DELETE IS LITERAL. Deleting a server removes the server and the entities
#      its paths reach — no more. Another page's subgraph is not consulted.
#      Anything left holding a NON-NULL edge into what was deleted is named in
#      the delete preview as ORPHANED; the delete still proceeds.
#
# TWO RULES
#   scalars        SUBTRACTIVE — a field added to the schema shows up on its own.
#                  Four keys remove or shape one, each naming its own surface:
#                    summary.ignoreFields   gone entirely (page-level) — also
#                                           removes a derived link row
#                    fields.<f>.tableHidden gone from TABLE columns — the list
#                                           page and relationship tabs alike.
#                                           Still shown in the detail summary.
#                    fields.<f>.createHidden gone from the CREATE form only
#                    fields.<f>.editable    whether the EDITOR may write it
#                  ⚠️ tableHidden is type-wide: two tables of one type cannot
#                     show different scalars.
#   link rows      DERIVED — every SINGLE relationship outside the subgraph is a
#                  link row under the field list. Navigation only: never edited,
#                  audited or deleted from the page.
#
# EDITABLE
#   `editable: true` on a subgraph entry = this page's editor writes it.
#   Single-cardinality at every hop and at most two hops; anything else is
#   refused out loud at load and renders read-only.
#
# DERIVED, never declared here
#   inline panel vs table   <- cardinality
#   does a row link         <- does its type have a page
#   the Audit Log tab       <- always last, on every page; covers the subgraph
#
# A deployment overrides this with a PARTIAL overlay (ORBITAL_VIEWS_OVERLAY_PATH)
# declaring only the pages or types it changes. Copying this whole file into an
# overlay freezes that deployment at today's shape, forever.

schemaVersion: v14

pages:

  DataCenter:
    menuWeight: 10
    subgraph:
      - servers
      - racks
      - kubernetesClusters
      - networkDevices

  Server:
    menuWeight: 20
    filterBy: dataCenter
    subgraph:
      - { path: idracSettings, editable: true }
      - { path: serverMaintenance, editable: true }
      - kubernetesNode
      - storageControllers
      - networkAdapters
      - networkInterfaces
      - storageControllers.storageDevices
      - storageControllers.storageVolumes

  KubernetesCluster:
    slug: clusters
    menuWeight: 30
    filterBy: dataCenter
    subgraph:
      - backup
      - { path: backup.etcd, editable: true }
      - { path: backup.velero, editable: true }
      - { path: backup.s3Sync, editable: true }
      - nodes

  NetworkDevice:
    menuWeight: 40
    subgraph:
      - virtualChassisMembers
      - networkInterfaces
      - networkInterfaceConnectedNetworkDevice

types:

  ConfigItem:
    fields:
      orbId: { label: Orb ID }

  DataCenter:
    columns:
      - servers.count
    fields:
      assetDataV2: { tableHidden: true }
      name: { editable: true }

  IdracSettings:
    fields:
      dhcpEnabled: { createDefault: "false" }
      ipmiEnabled: { createDefault: "false" }
      lockdownModeEnabled: { createDefault: "false" }
      osToIdracPassThroughEnabled: { createDefault: "false" }
      racadmEnabled: { createDefault: "true" }
      sshEnabled: { createDefault: "false" }
      usbManagementPortEnabled: { createDefault: "true" }

  ServerMaintenance:
    # A new server is not in maintenance, so only the switch is worth asking
    # about up front. The window and reason stay editable — they are just not
    # part of CREATING a server, and a maintenance window typed at the moment a
    # machine is first recorded is a guess.
    fields:
      enabled: { createDefault: "false" }
      reason: { createHidden: true }
      windowStart: { createHidden: true }
      windowEnd: { createHidden: true }


  IPAddress:
    fields:
      address: { editable: false }
      role: { editable: false }
      type: { editable: false }

  KubernetesCluster:
    refColumns: [dataCenter]
    columns:
      - nodes.count
    order: [name, provider, clusterType, environment, kubernetesVersion]
    fields:
      cni: { label: CNI }
      description: { editable: false, tableHidden: true }
      provider: { editable: false }

  EksaKubernetesCluster:

  KubernetesNode:
    refColumns: [server]
    fields:
      gpu: { label: GPU, editable: false, tableHidden: true }
      notes: { editable: false, tableHidden: true }
      owner: { editable: false, tableHidden: true }
      role: { editable: false }

  NetworkAdapter:
    fields:
      manufacturer: { editable: false }
      model: { editable: false }
      partNumber: { editable: false }
      serialNumber: { editable: false }

  NetworkDevice:
    refColumns: [dataCenter, rack]
    fields:
      macAddress: { label: MAC Address }
      networkInterfaceConnectedNetworkDevice: { label: Connections }
      networkInterfaces: { label: Ports }
      face: { tableHidden: true }
      platform: { tableHidden: true }
      rackPosition: { tableHidden: true }
      vcPosition: { label: VC Position, tableHidden: true }
      vcPriority: { label: VC Priority, tableHidden: true }

  NetworkInterface:
    refColumns: [server, networkAdapter, connectedNetworkDevice]
    columns:
      - server.kubernetesNode.cluster.name
      - server.kubernetesNode.role
      - server.kubernetesNode.gpu
    fields:
      connectedNetworkDevicePort: { editable: false }
      linkSpeedMbps: { editable: false }
      macAddress: { label: MAC Address, editable: false }
      mgmtOnly: { editable: false, tableHidden: true }
      portType: { editable: false }

  Rack:
    columns:
      - servers.count
    fields:
      name: { editable: true }

  Server:
    refColumns: [dataCenter, oobIP, rack]
    columns:
      - kubernetesNode.cluster.name
      - kubernetesNode.role
      - kubernetesNode.gpu
    fields:
      oobIP: { label: OOB IP }
      oobMAC: { label: OOB MAC, tableHidden: true }
      manufacturer: { tableHidden: true, createDefault: Dell }
      model: { createDefault: PowerEdge R450 }
      serialNumber: { tableHidden: true }
      uHeight: { tableHidden: true, createDefault: "1" }

  ServerConfigurationProfile:
    fields:
      json: { editable: false }

  StorageDevice:
    refColumns: [storageController]
    fields:
      capacityBytes: { editable: false }
      manufacturer: { editable: false }
      model: { editable: false, tableHidden: true }
      serialNumber: { editable: false }
      wwn: { label: WWN, editable: false }

  StorageVolume:
    fields:
      capacityBytes: { editable: false }
      manufacturer: { editable: false }
      model: { editable: false }
      serialNumber: { editable: false }
      wwn: { editable: false }

# ── which page is a node's HOME ──────────────────────────────────────────────
# The inverse question to a page. An IPAddress is deleted by nobody and shown by
# four pages; with no /ip-addresses/<id> this is the only answer to "that
# address turned up in a diff, where do I look at it?".
canonicalParent:
  IPAddress:
    - { type: Server, field: serverOobIP, down: oobIP }
    - { type: KubernetesNode, field: kubernetesNodeIpv4, down: ipv4 }
    - { type: KubernetesCluster, field: kubernetesClusterControlPlaneEndpoint, down: controlPlaneEndpoint }
    - { type: EksaKubernetesCluster, field: eksaKubernetesClusterTinkerbellIP, down: tinkerbellIP }
  NetworkInterface:
    - { type: NetworkAdapter, field: networkAdapter, down: networkInterfaces }
    - { type: Server, field: server, down: networkInterfaces }
    - { type: NetworkDevice, field: networkDevice, down: networkInterfaces }
  StorageVolume:
    - { type: StorageController, field: storageController }
