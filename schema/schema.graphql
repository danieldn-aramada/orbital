# Orbital DGraph Schema
#
# Rules:
#   - Schema changes must be backwards compatible. Orbs may be on older versions.
#   - New types and nullable fields are safe. Removing or renaming fields is not.
#   - Schema is NOT auto-applied on startup (yet — auto-apply is a tracked ROADMAP item).
#     It is applied only by `make seed`, restore, export-to-scratch, and orb import. On any
#     schema-version bump you MUST apply it to the target DGraph as a deploy step — see
#     docs/reference/DGRAPH.md "Schema rules". A schema-bumping image deploy does NOT reach
#     the running DGraph by itself.
#   - orbital tracks the active schema version in PostgreSQL, but a direct /admin/schema
#     apply does NOT update that record — reconcile via a backup/restore cycle if the
#     /schema page shows a version mismatch.
#
# DGraph directives used:
#   @search     — enables filtering/querying on a field
#   @hasInverse — declares the reverse edge of a relationship
#   @id         — marks a field as a unique identifier (like a unique index)
#
# Namespace/DataCenter convention:
#   Namespace is a pure tenancy boundary — not a config item, no config fields.
#   DataCenter implements ConfigItem and holds all data center config fields.
#   Convention: exactly one Namespace per DataCenter, enforced by orbital's app layer.
#   The namespace field on ConfigItem is a direct reference (not traversed via DataCenter)
#   kept for query performance when scoping by namespace boundary.
type Namespace {
    id: ID!
    name: String! @id @search(by: [term])
    createdBy: String
    createdAt: DateTime
}

type User {
    id: ID!
    email: String! @id @search(by: [hash])
}

# ConfigItem Interface
#  orbId is the public stable identifier
#  version is the optimistic-concurrency counter. Auto-incremented by orbital's
#  GraphQL proxy on every mutation — clients don't need to set it.
interface ConfigItem {
    id: ID!
    namespace: String! @search(by: [exact])
    orbId: String! @id @search(by: [hash])
    name: String @search(by: [term])
    createdBy: String @search(by: [hash])
    createdAt: DateTime @search
    updatedBy: String @search(by: [hash])
    updatedAt: DateTime @search
    version: Int!
}

########################
# Config Items
########################
type DataCenter implements ConfigItem {
    assetDataV2: String @search(by: [regexp]) # json

    servers: [Server] @hasInverse(field: dataCenter)
    racks: [Rack] @hasInverse(field: dataCenter)
    kubernetesClusters: [KubernetesCluster] @hasInverse(field: dataCenter)
}

type Rack implements ConfigItem {
    dataCenter: DataCenter!
    servers: [Server] @hasInverse(field: rack)
}

type Server implements ConfigItem {
    hostname: String @search(by: [term])
    model: String @search(by: [term])
    manufacturer: String @search(by: [hash]) 
    serviceTag: String @search(by: [hash])
    rackPosition: Int
    oobMAC: String

    dataCenter: DataCenter!
    rack: Rack
    idracSettings: IdracSettings @hasInverse(field: server)
    serverConfigurationProfile: ServerConfigurationProfile @hasInverse(field: server)
    storageControllers: [StorageController] @hasInverse(field: server)
    kubernetesNode: KubernetesNode @hasInverse(field: server)

    oobIP: IPAddress @hasInverse(field: serverOobIP)
}


type IdracSettings implements ConfigItem {
    firmwareVersion: String
    osToIdracPassThroughEnabled: Boolean
    sshEnabled: Boolean
    usbManagementPortEnabled: Boolean
    ipmiEnabled: Boolean
    lockdownModeEnabled: Boolean
    dhcpEnabled: Boolean
    racadmEnabled: Boolean

    server: Server!
}

type ServerConfigurationProfile implements ConfigItem {
    json: String 

    server: Server!
}

type StorageController implements ConfigItem {

    server: Server!
    storageDevices: [StorageDevice] @hasInverse(field: storageController)
}

type StorageDevice implements ConfigItem {
    capacityBytes: Int
    manufacturer: String
    model: String
    serialNumber: String
    wwn: String

    storageController: StorageController!
    storageVolumes: [StorageVolume] @hasInverse(field: storageDevices)
}

type StorageVolume implements ConfigItem {
    capacityBytes: Int
    manufacturer: String
    model: String
    serialNumber: String
    wwn: String

    storageController: StorageController!
    storageDevices: [StorageDevice] @hasInverse(field: storageVolumes)
}

interface KubernetesCluster {
    kubernetesVersion: String
    controlPlaneEndpoint: IPAddress
    cni: String @search(by: [term])         # cilium, calico, flannel
    environment: String @search(by: [term]) # prod, staging, dev
    description: String                     # free-text purpose ("Aramco ISV", "SpectroCloud POC")
    provider: String @search(by: [term, hash])    # eksa, maas, metal3 — canonical token, single source for UI display + filter

    dataCenter: DataCenter!
    nodes: [KubernetesNode] @hasInverse(field: cluster)
    backup: ClusterBackup
}

type EksaKubernetesCluster implements KubernetesCluster & ConfigItem {
    clusterType: String @search(by: [term]) # management, standalone, workload
    tinkerbellIP: IPAddress

    managementCluster: EksaKubernetesCluster
    workloadClusters: [EksaKubernetesCluster] @hasInverse(field: managementCluster)
}

type KubernetesNode implements ConfigItem {
    role: String @search(by: [term]) # control_plane, worker
    ipv4: IPAddress                  # cluster-network IP (distinct from server.oobIP)
    gpu: Boolean @search             # node contributes GPU resources to the cluster
    owner: String @search(by: [term])
    notes: String

    cluster: KubernetesCluster!
    server: Server!
}

type ClusterBackup implements ConfigItem {
    etcd: EtcdBackup
    velero: VeleroBackup
    s3Sync: S3Sync

    cluster: KubernetesCluster @hasInverse(field: backup)
}

type EtcdBackup implements ConfigItem {
    enabled: Boolean @search   
    schedule: String
    location: String @search(by: [hash])
    retentionDays: Int

    clusterBackupEtcd: ClusterBackup @hasInverse(field: etcd)
}

type VeleroBackup implements ConfigItem {
    enabled: Boolean @search
    schedule: String
    location: String @search(by: [hash])
    retentionDays: Int

    clusterBackupVelero: ClusterBackup @hasInverse(field: velero)
}

type S3Sync implements ConfigItem {
    enabled: Boolean @search

    clusterBackupS3Sync: ClusterBackup @hasInverse(field: s3Sync)
}


type IPAddress implements ConfigItem {
    type: String # ipv4, ipv6
    address: String! @search(by: [hash])
    role: String @search(by: [term]) # oob, tinkerbell, k8s_api, k8s_node

    # Reverse-pointer convention: <typeName-camelCase><FieldName-PascalCase>.
    # Long but mechanically derived from the forward edge. Re-evaluate if 
    # audit/divergence surfaces feel noisy.
    serverOobIP: Server
    kubernetesClusterControlPlaneEndpoint: KubernetesCluster @hasInverse(field: controlPlaneEndpoint)
    eksaKubernetesClusterTinkerbellIP: [EksaKubernetesCluster] @hasInverse(field: tinkerbellIP)
    kubernetesNodeIpv4: KubernetesNode @hasInverse(field: ipv4)
}
