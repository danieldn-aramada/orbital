# Orbital DGraph Schema
# Conventions, apply steps, version bumps and gotchas: docs/reference/DGRAPH.md
#
# Two that bite if you skip the doc:
#   - Editing this file changes no running DGraph. Applying it is a separate deploy step.
#   - Docstrings are machine-read, not prose — see internal/configitems/derive.go.
type Namespace {
    id: ID!
    name: String! @id @search(by: [term])
    createdBy: String
    createdAt: DateTime
}

type User {
    id: ID!
    email: String! @id @search(by: [hash])
}

# ConfigItem Interface
#  orbId is the public stable identifier
#  version is the optimistic-concurrency counter, auto-incremented by orbital's
#  single write path. @search makes it FILTERABLE, which is what lets the
#  concurrency check be a compare-and-swap: orbital injects
#  `version: { eq: $ifVersion }` into the mutation's own filter. On the interface
#  so every implementing type gets `version: IntFilter`.
interface ConfigItem {
    id: ID!
    namespace: String! @search(by: [exact])
    orbId: String! @id(interface: true) @search(by: [hash])
    name: String @search(by: [term])
    createdBy: String @search(by: [hash])
    createdAt: DateTime @search
    updatedBy: String @search(by: [hash])
    updatedAt: DateTime @search
    version: Int! @search
}

########################
# Config Items
########################
enum DataCenterModel {
    Beacon
    Cruiser
    Triton
    Leviathan
}

"""orbIdPattern: {name}"""
type DataCenter implements ConfigItem {
    """jsonString"""
    assetDataV2: String @search(by: [regexp]) # json
    model: DataCenterModel @search(by: [hash])

    servers: [Server] @hasInverse(field: dataCenter)
    racks: [Rack] @hasInverse(field: dataCenter)
    kubernetesClusters: [KubernetesCluster] @hasInverse(field: dataCenter)
    networkDevices: [NetworkDevice] @hasInverse(field: dataCenter)
}

"""orbIdPattern: {name}"""
type Rack implements ConfigItem {
    uHeight: Int
    dataCenter: DataCenter!
    servers: [Server] @hasInverse(field: rack)
    networkDevices: [NetworkDevice] @hasInverse(field: rack)
}

"""orbIdPattern: {kind}-{serviceTag}"""
type Server implements ConfigItem {
    hostname: String @search(by: [term])
    model: String @search(by: [term])
    manufacturer: String @search(by: [hash]) 
    serviceTag: String @search(by: [hash])
    serialNumber: String @search(by: [hash])
    rackPosition: Int
    uHeight: Float
    oobMAC: String

    dataCenter: DataCenter!
    rack: Rack
    idracSettings: IdracSettings @hasInverse(field: server)
    serverConfigurationProfile: ServerConfigurationProfile @hasInverse(field: server)
    serverMaintenance: ServerMaintenance @hasInverse(field: server)
    storageControllers: [StorageController] @hasInverse(field: server)
    networkAdapters: [NetworkAdapter] @hasInverse(field: server)
    networkInterfaces: [NetworkInterface] @hasInverse(field: server)
    kubernetesNode: KubernetesNode @hasInverse(field: server)

    oobIP: IPAddress @hasInverse(field: serverOobIP)
}


"""
orbIdSuffix: idrac
orbIdPattern: {server.serviceTag}-{kind}
"""
type IdracSettings implements ConfigItem {
    firmwareVersion: String
    osToIdracPassThroughEnabled: Boolean
    sshEnabled: Boolean
    usbManagementPortEnabled: Boolean
    ipmiEnabled: Boolean
    lockdownModeEnabled: Boolean
    dhcpEnabled: Boolean
    racadmEnabled: Boolean

    server: Server!
}

"""
orbIdSuffix: scp
orbIdPattern: {server.serviceTag}-{kind}
"""
type ServerConfigurationProfile implements ConfigItem {
    json: String 

    # NULLABLE (v13). A non-null back-edge means the child cannot outlive the
    # parent, which forces it to be an editable member of the server's view —
    # and an SCP is a scanned document nobody edits from the server page. Made
    # optional so a view may legitimately leave it out. See UI.md.
    server: Server
}

# Maintenance intent for a server — DESIRED state only (edge actuates + observes).
#   enabled     — on/off switch: true = maintenance requested. Exit = enabled:false
#                 (symmetric toggle), not clearing a timestamp.
#   windowStart — optional scheduling: don't begin before this (null = begin now).
#   windowEnd   — optional scheduling: don't begin after this (null = no deadline);
#                 gates entry only, never exit.
# Observed phase (Draining/Active/...) lives at the edge (serverconfig.status +
# monitoring), NOT here.
"""orbIdPattern: {kind}-{server.serviceTag}"""
type ServerMaintenance implements ConfigItem {
    enabled: Boolean
    windowStart: DateTime
    windowEnd: DateTime
    reason: String

    server: Server!
}

"""orbIdPattern: {server.serviceTag}-{name}"""
type StorageController implements ConfigItem {

    server: Server!
    storageDevices: [StorageDevice] @hasInverse(field: storageController)
    # v13: the inverse of StorageVolume.storageController, which existed as a
    # non-null edge with no way back. A volume belongs to ONE controller and may
    # span several devices, so the controller is where it is owned.
    storageVolumes: [StorageVolume] @hasInverse(field: storageController)
}

"""orbIdPattern: {serialNumber}"""
type StorageDevice implements ConfigItem {
    capacityBytes: Int
    manufacturer: String
    model: String
    serialNumber: String
    wwn: String

    storageController: StorageController!
    storageVolumes: [StorageVolume] @hasInverse(field: storageDevices)
}

"""orbIdPattern: {storageController.server.serviceTag}-{name}"""
type StorageVolume implements ConfigItem {
    capacityBytes: Int
    manufacturer: String
    model: String
    serialNumber: String
    wwn: String

    storageController: StorageController!
    storageDevices: [StorageDevice] @hasInverse(field: storageVolumes)
}

"""orbIdPattern: {kind}-{server.serviceTag}-{name}"""
type NetworkAdapter implements ConfigItem {
    # NIC card (FRU). Redfish-authoritative; OPTIONAL (absent for flat-only sources).
    # name = adapter FQDD, e.g. "NIC.Integrated.1"
    model: String @search(by: [term])
    manufacturer: String @search(by: [hash])
    serialNumber: String @search(by: [hash])
    partNumber: String @search(by: [hash])

    server: Server!
    networkInterfaces: [NetworkInterface] @hasInverse(field: networkAdapter)
}

# TWO patterns, because this type's identity hangs off whichever owner it
# actually has — a server NIC's orbId is built from the SERVER's serviceTag (not
# the adapter's, which carries the same value), and a switch port's from the
# DEVICE's serial. That is the same XOR the owner comment below describes.
#
# This is the case that killed `derivesIdFrom:`: it was single-valued, so it
# could not say "one of these". It carried `networkAdapter` briefly, which was
# right for one of three parents and wrong for the other two, and the field it
# populated was deleted in 2026-10 without ever having been read. Repeating
# `orbIdPattern:` is how the alternative is expressed; first one whose
# placeholders all resolve wins.
"""
orbIdPattern: {kind}-{server.serviceTag}-{name}
orbIdPattern: {kind}-{networkDevice.serial}-{name}
"""
type NetworkInterface implements ConfigItem {
    # Port/interface (physical OR logical LAG). name = source ifname/FQDD.
    macAddress: String @search(by: [hash])  # cross-source join key (MAC)
    portType: String @search(by: [term])  # Ethernet | InfiniBand | FibreChannel | LAG
    linkSpeedMbps: Int  # negotiated link speed (Redfish CurrentLinkSpeedMbps); null when link down
    mgmtOnly: Boolean @search  # management-plane interface (BMC/iDRAC); mirrors NetBox interface.mgmt_only. No networkAdapter (the BMC is a Manager, not a NIC FRU — its controller identity is IdracSettings)

    # Owner — exactly one of {server, networkDevice} (XOR; DGraph can't enforce, app-checked).
    server: Server                          # server NIC port (was Server!; relaxed so switches can own ports)
    networkDevice: NetworkDevice            # switch/firewall/router port (the fabric side)
    networkAdapter: NetworkAdapter         # physical server ports only (null for a LAG or a switch port)
    # Cabling. connectedNetworkInterface is the canonical port↔port model (both ends real ports) — server-NIC↔switch
    # AND switch↔switch. connectedNetworkDevice(+Port) stays transitionally (what the server-side seed sets today;
    # derivable via connectedNetworkInterface.networkDevice). Switch ports + connectedNetworkInterface are populated by
    # Spike 32 (docs/network-model.md §8) — until then these fabric edges are defined-but-unpopulated by design.
    connectedNetworkInterface: NetworkInterface       # cabled far-end PORT (set on both ends)
    connectedNetworkDevice: NetworkDevice   # intended cabling far-end (switch/router/firewall)
    connectedNetworkDevicePort: String      # remote port label, e.g. "xe-1/0/28"
    lag: NetworkInterface                       # link aggregation group
    lagMembers: [NetworkInterface] @hasInverse(field: lag)
}

"""orbIdPattern: {kind}-{serial}"""
type NetworkDevice implements ConfigItem {
    # Network gear (switch / router / firewall / sd-wan), role-differentiated. NetBox-sourced identity anchor.
    manufacturer: String @search(by: [hash])
    model: String @search(by: [term])
    serial: String @search(by: [hash])
    role: String @search(by: [term])         # tor | core | mgmt | edge | leaf | spine | router | firewall | sd-wan
    macAddress: String @search(by: [hash])   # device MAC (identity, from NetBox)
    platform: String @search(by: [term])     # NOS / platform (NetBox device.platform), e.g. Junos
    rackPosition: Int                        # U-slot in the rack (NetBox device.position)
    face: String                             # rack face: front | rear (NetBox device.face)
    vcPosition: Int                          # Virtual Chassis member position (NetBox vc_position)
    vcPriority: Int                          # Virtual Chassis member priority (NetBox vc_priority)

    dataCenter: DataCenter!
    rack: Rack                               # physical rack (NetBox device.rack) — exposes per-rack failure domains
    virtualChassis: NetworkDevice            # VC master this device belongs to (self-edge, member→master); null if standalone/master
    virtualChassisMembers: [NetworkDevice] @hasInverse(field: virtualChassis)  # auto-filled on the master
    networkInterfaces: [NetworkInterface] @hasInverse(field: networkDevice)               # ports THIS device owns (the fabric side)
    networkInterfaceConnectedNetworkDevice: [NetworkInterface] @hasInverse(field: connectedNetworkDevice)
}

interface KubernetesCluster {
    kubernetesVersion: String
    controlPlaneEndpoint: IPAddress
    cni: String @search(by: [term])         # cilium, calico, flannel
    environment: String @search(by: [term]) # prod, staging, dev
    description: String                     # free-text purpose ("Aramco ISV", "SpectroCloud POC")
    provider: String @search(by: [term, hash])    # eksa, maas, metal3 — canonical token, single source for UI display + filter

    dataCenter: DataCenter!
    nodes: [KubernetesNode] @hasInverse(field: cluster)
    backup: ClusterBackup
}

"""orbIdPattern: {name}"""
type EksaKubernetesCluster implements KubernetesCluster & ConfigItem {
    clusterType: String @search(by: [term]) # management, standalone, workload
    tinkerbellIP: IPAddress

    managementCluster: EksaKubernetesCluster
    workloadClusters: [EksaKubernetesCluster] @hasInverse(field: managementCluster)
}

"""orbIdPattern: {name}"""
type KubernetesNode implements ConfigItem {
    role: String @search(by: [term]) # control_plane, worker
    ipv4: IPAddress                  # cluster-network IP (distinct from server.oobIP)
    gpu: Boolean @search             # node contributes GPU resources to the cluster
    owner: String @search(by: [term])
    notes: String

    cluster: KubernetesCluster!
    server: Server!
}

"""
orbIdSuffix: backup
orbIdPattern: {cluster.name}-{kind}
"""
type ClusterBackup implements ConfigItem {
    etcd: EtcdBackup
    velero: VeleroBackup
    s3Sync: S3Sync

    # NON-NULL (v14): a ClusterBackup has no existence without its cluster.
    # A non-null back-edge IS the ownership declaration — see UI.md.
    cluster: KubernetesCluster! @hasInverse(field: backup)
}

"""
orbIdSuffix: etcd-backup
orbIdPattern: {clusterBackupEtcd.cluster.name}-{kind}
"""
type EtcdBackup implements ConfigItem {
    enabled: Boolean @search   
    schedule: String
    location: String @search(by: [hash])
    retentionDays: Int

    clusterBackupEtcd: ClusterBackup! @hasInverse(field: etcd)   # NON-NULL (v14)
}

"""
orbIdSuffix: velero-backup
orbIdPattern: {clusterBackupVelero.cluster.name}-{kind}
"""
type VeleroBackup implements ConfigItem {
    enabled: Boolean @search
    schedule: String
    location: String @search(by: [hash])
    retentionDays: Int

    clusterBackupVelero: ClusterBackup! @hasInverse(field: velero)   # NON-NULL (v14)
}

"""
orbIdSuffix: s3sync
orbIdPattern: {clusterBackupS3Sync.cluster.name}-{kind}
"""
type S3Sync implements ConfigItem {
    enabled: Boolean @search

    clusterBackupS3Sync: ClusterBackup! @hasInverse(field: s3Sync)   # NON-NULL (v14)
}


"""orbIdPattern: {address}"""
type IPAddress implements ConfigItem {
    type: String # ipv4, ipv6
    address: String! @search(by: [hash])
    role: String @search(by: [term]) # oob, tinkerbell, k8s_api, k8s_node

    # Reverse-pointer convention: <typeName-camelCase><FieldName-PascalCase>.
    # Long but mechanically derived from the forward edge. Re-evaluate if 
    # audit/divergence surfaces feel noisy.
    serverOobIP: Server
    kubernetesClusterControlPlaneEndpoint: KubernetesCluster @hasInverse(field: controlPlaneEndpoint)
    eksaKubernetesClusterTinkerbellIP: [EksaKubernetesCluster] @hasInverse(field: tinkerbellIP)
    kubernetesNodeIpv4: KubernetesNode @hasInverse(field: ipv4)
}
