# Orbital's DGraph GraphQL schema.
#
# Conventions, apply steps and versioning: docs/reference/DGRAPH.md.
# Editing this file changes no running DGraph; applying it is a separate deploy step.
# Description lines such as `orbIdPattern: …` are annotations read by internal/configitems.

"""
A tenancy boundary: the scope one data center's configuration items live in.
It holds no configuration of its own.
"""
type Namespace {
  """
  DGraph's internal node ID.
  """
  id: ID!

  """
  The namespace's name, e.g. `colo`. Every orbId in the namespace starts with it.
  """
  name: String! @id @search(by: [term])

  """
  Who created the namespace.
  """
  createdBy: String

  """
  When the namespace was created.
  """
  createdAt: DateTime
}

"""
A user known to the graph, identified by email address.
"""
type User {
  """
  DGraph's internal node ID.
  """
  id: ID!

  """
  The user's email address.
  """
  email: String! @id @search(by: [hash])
}

"""
A configuration item: an entity orbital holds design intent for. Every item
carries a stable identity, who changed it and when, and a version for
optimistic concurrency.
"""
interface ConfigItem {
  """
  DGraph's internal node ID. It is not stable across export and restore; refer to
  items by `orbId`.
  """
  id: ID!

  """
  The namespace the item belongs to, e.g. `colo`.
  """
  namespace: String! @search(by: [exact])

  """
  The item's stable identifier, in the form `<namespace>:<type>-<natural key>`.
  For example, `colo:server-CFRHDX3`. Unique across all types and never changes.
  """
  orbId: String! @id(interface: true) @search(by: [hash])

  """
  The item's display name.
  """
  name: String @search(by: [term])

  """
  Who created the item. Set by orbital.
  """
  createdBy: String @search(by: [hash])

  """
  When the item was created. Set by orbital.
  """
  createdAt: DateTime @search

  """
  Who last changed the item. Set by orbital.
  """
  updatedBy: String @search(by: [hash])

  """
  When the item was last changed. Set by orbital.
  """
  updatedAt: DateTime @search

  """
  Optimistic-concurrency counter, incremented by orbital on every write. Send the
  version you read with an update, and the update is refused if the item has
  changed since.
  """
  version: Int! @search
}

"""
The model of a modular data center.
"""
enum DataCenterModel {
  Beacon
  Cruiser
  Triton
  Leviathan
}

"""
A modular data center, and the root of its namespace's configuration.

orbIdPattern: {type}-{name}
"""
type DataCenter implements ConfigItem {
  """
  The data center's asset record, as a JSON document.

  jsonString
  """
  assetDataV2: String @search(by: [regexp])

  """
  The data center's model.
  """
  model: DataCenterModel @search(by: [hash])

  """
  Servers in the data center.
  """
  servers: [Server] @hasInverse(field: dataCenter)

  """
  Racks in the data center.
  """
  racks: [Rack] @hasInverse(field: dataCenter)

  """
  Kubernetes clusters running in the data center.
  """
  kubernetesClusters: [KubernetesCluster] @hasInverse(field: dataCenter)

  """
  Switches, routers, firewalls and other network devices in the data center.
  """
  networkDevices: [NetworkDevice] @hasInverse(field: dataCenter)
}

"""
A rack in a data center.

orbIdPattern: {type}-{name}
"""
type Rack implements ConfigItem {
  """
  How many rack units (U) the rack has.
  """
  uHeight: Int

  """
  The data center the rack is in.
  """
  dataCenter: DataCenter!

  """
  Servers mounted in the rack.
  """
  servers: [Server] @hasInverse(field: rack)

  """
  Network devices mounted in the rack.
  """
  networkDevices: [NetworkDevice] @hasInverse(field: rack)
}

"""
A physical server.

orbIdPattern: {type}-{serviceTag}
"""
type Server implements ConfigItem {
  """
  The server's hostname.
  """
  hostname: String @search(by: [term])

  """
  The manufacturer's model name, e.g. `PowerEdge R650`.
  """
  model: String @search(by: [term])

  """
  The manufacturer's name.
  """
  manufacturer: String @search(by: [hash])

  """
  The manufacturer's stable chassis identifier, and the key in the server's orbId.
  Dell's Service Tag (Redfish `SKU`), or Supermicro's serial number.
  """
  serviceTag: String @search(by: [hash])

  """
  The serial number Redfish reports. Not an identity key: on Dell 15G and later it
  differs from the Service Tag.
  """
  serialNumber: String @search(by: [hash])

  """
  The server's position in its rack, in rack units.
  """
  rackPosition: Int

  """
  How many rack units (U) the server occupies.
  """
  uHeight: Float

  """
  The MAC address of the server's management controller (iDRAC or BMC).
  """
  oobMAC: String

  """
  The data center the server is in.
  """
  dataCenter: DataCenter!

  """
  The rack the server is mounted in.
  """
  rack: Rack

  """
  The server's iDRAC settings.
  """
  idracSettings: IdracSettings @hasInverse(field: server)

  """
  The server's Dell Server Configuration Profile.
  """
  serverConfigurationProfile: ServerConfigurationProfile @hasInverse(field: server)

  """
  Maintenance requested for the server.
  """
  serverMaintenance: ServerMaintenance @hasInverse(field: server)

  """
  The server's storage controllers.
  """
  storageControllers: [StorageController] @hasInverse(field: server)

  """
  The server's network adapters.
  """
  networkAdapters: [NetworkAdapter] @hasInverse(field: server)

  """
  The server's network ports, including its management port.
  """
  networkInterfaces: [NetworkInterface] @hasInverse(field: server)

  """
  The Kubernetes node running on the server.
  """
  kubernetesNode: KubernetesNode @hasInverse(field: server)

  """
  The IP address of the server's management controller.
  """
  oobIP: IPAddress @hasInverse(field: serverOobIP)
}

"""
Desired settings for a Dell server's iDRAC management controller.

orbIdSuffix: idrac
orbIdPattern: {server.serviceTag}-{type}
"""
type IdracSettings implements ConfigItem {
  """
  The iDRAC firmware version.
  """
  firmwareVersion: String

  """
  The firmware repository the server should use: a path to a pinned Dell
  repository, e.g. `dell/R650/2026-10-09T155510Z`.
  """
  firmwareRepository: String

  """
  Whether OS-to-iDRAC pass-through is enabled.
  """
  osToIdracPassThroughEnabled: Boolean

  """
  Whether SSH access to the iDRAC is enabled.
  """
  sshEnabled: Boolean

  """
  Whether the iDRAC's USB management port is enabled.
  """
  usbManagementPortEnabled: Boolean

  """
  Whether IPMI over LAN is enabled.
  """
  ipmiEnabled: Boolean

  """
  Whether system lockdown mode is enabled.
  """
  lockdownModeEnabled: Boolean

  """
  Whether the iDRAC gets its IP address over DHCP.
  """
  dhcpEnabled: Boolean

  """
  Whether remote RACADM is enabled.
  """
  racadmEnabled: Boolean

  """
  The server the settings apply to.
  """
  server: Server!
}

"""
A Dell Server Configuration Profile (SCP) for a server.

orbIdSuffix: scp
orbIdPattern: {server.serviceTag}-{type}
"""
type ServerConfigurationProfile implements ConfigItem {
  """
  The profile document, in JSON.
  """
  json: String

  """
  The server the profile belongs to.
  """
  server: Server
}

"""
Maintenance requested for a server. Desired state only: the edge acts on it and
tracks the observed phase itself.

orbIdPattern: {type}-{server.serviceTag}
"""
type ServerMaintenance implements ConfigItem {
  """
  Whether maintenance is requested. Set it to false to end maintenance.
  """
  enabled: Boolean

  """
  The earliest time maintenance may begin. Unset means it may begin now.
  """
  windowStart: DateTime

  """
  The latest time maintenance may begin. Unset means there is no deadline. It
  does not end maintenance.
  """
  windowEnd: DateTime

  """
  Why maintenance is requested.
  """
  reason: String

  """
  The server to maintain.
  """
  server: Server!
}

"""
A storage controller in a server, such as a RAID controller or HBA.

orbIdPattern: {server.serviceTag}-{name}
"""
type StorageController implements ConfigItem {
  """
  The server the controller is in.
  """
  server: Server!

  """
  Drives attached to the controller.
  """
  storageDevices: [StorageDevice] @hasInverse(field: storageController)

  """
  Volumes the controller presents. A volume belongs to one controller and may
  span several drives.
  """
  storageVolumes: [StorageVolume] @hasInverse(field: storageController)
}

"""
A physical drive.

orbIdPattern: {serialNumber}
"""
type StorageDevice implements ConfigItem {
  """
  Capacity, in bytes.
  """
  capacityBytes: Int

  """
  The manufacturer's name.
  """
  manufacturer: String

  """
  The manufacturer's model name.
  """
  model: String

  """
  The drive's serial number, and the key in its orbId.
  """
  serialNumber: String

  """
  The drive's World Wide Name.
  """
  wwn: String

  """
  The bay or slot the drive is in.
  """
  slot: Int

  """
  The media type, e.g. `SSD` or `HDD`.
  """
  mediaType: String

  """
  The interface protocol, e.g. `SAS`, `SATA` or `NVMe`.
  """
  protocol: String

  """
  What the drive is for. One of `ceph-osd`, `os`, `none`, or the name of another
  storage system. Unset means no preference.
  """
  role: String @search(by: [hash])

  """
  The controller the drive is attached to.
  """
  storageController: StorageController!

  """
  Volumes the drive is part of.
  """
  storageVolumes: [StorageVolume] @hasInverse(field: storageDevices)

  """
  The drive's partitions.
  """
  partitions: [DiskPartition] @hasInverse(field: storageDevice)
}

"""
A logical volume presented by a storage controller, such as a RAID virtual disk.

orbIdPattern: {storageController.server.serviceTag}-{name}
"""
type StorageVolume implements ConfigItem {
  """
  Capacity, in bytes.
  """
  capacityBytes: Int

  """
  The manufacturer's name.
  """
  manufacturer: String

  """
  The manufacturer's model name.
  """
  model: String

  """
  The volume's serial number.
  """
  serialNumber: String

  """
  The volume's World Wide Name.
  """
  wwn: String

  """
  The controller presenting the volume.
  """
  storageController: StorageController!

  """
  Drives the volume spans.
  """
  storageDevices: [StorageDevice] @hasInverse(field: storageVolumes)
}

"""
A partition on a drive.

orbIdPattern: {type}-{storageDevice.serialNumber}-{number}
"""
type DiskPartition implements ConfigItem {
  """
  The partition number: the `1` in `sdb1` or `nvme0n1p1`.
  """
  number: Int

  """
  The filesystem type, e.g. `vfat`, `ext4` or `xfs`.
  """
  fsType: String

  """
  Where the filesystem is mounted, e.g. `/boot/efi` or `/var`. Unset means it is
  not mounted.
  """
  mountPoint: String

  """
  Whether the partition is LUKS-encrypted. If it is, `fsType` and `mountPoint`
  describe the unlocked device.
  """
  encrypted: Boolean

  """
  The drive the partition is on.
  """
  storageDevice: StorageDevice!
}

"""
A network interface card in a server, as Redfish reports it. Its `name` is the
card's FQDD, e.g. `NIC.Integrated.1`.

orbIdPattern: {type}-{server.serviceTag}-{name}
"""
type NetworkAdapter implements ConfigItem {
  """
  The manufacturer's model name.
  """
  model: String @search(by: [term])

  """
  The manufacturer's name.
  """
  manufacturer: String @search(by: [hash])

  """
  The card's serial number.
  """
  serialNumber: String @search(by: [hash])

  """
  The manufacturer's part number.
  """
  partNumber: String @search(by: [hash])

  """
  The server the card is installed in.
  """
  server: Server!

  """
  The card's ports.
  """
  networkInterfaces: [NetworkInterface] @hasInverse(field: networkAdapter)
}

"""
A network port: a physical port on a server or network device, or a link
aggregation group (LAG). Its `name` is the interface name or FQDD the source
reports. A port belongs to exactly one of `server` or `networkDevice`; orbital
checks this, because DGraph cannot.

orbIdPattern: {type}-{server.serviceTag}-{name}
orbIdPattern: {type}-{networkDevice.serialNumber}-{name}
"""
type NetworkInterface implements ConfigItem {
  """
  The port's MAC address, used to match the same port across sources.
  """
  macAddress: String @search(by: [hash])

  """
  The port type. One of `Ethernet`, `InfiniBand`, `FibreChannel` or `LAG`.
  """
  portType: String @search(by: [term])

  """
  The negotiated link speed in Mbit/s (Redfish `CurrentLinkSpeedMbps`). Unset
  when the link is down.
  """
  linkSpeedMbps: Int

  """
  Whether this is a management port, such as an iDRAC or BMC port. A management
  port has no network adapter.
  """
  mgmtOnly: Boolean @search

  """
  The server that owns the port, for a server port.
  """
  server: Server

  """
  The network device that owns the port, for a switch, router or firewall port.
  """
  networkDevice: NetworkDevice

  """
  The card the port is on. Set for physical server ports only.
  """
  networkAdapter: NetworkAdapter

  """
  The port at the other end of the cable. Set on both ends.
  """
  connectedNetworkInterface: NetworkInterface

  """
  The network device at the other end of the cable.
  """
  connectedNetworkDevice: NetworkDevice

  """
  The label of the port at the other end of the cable, e.g. `xe-1/0/28`.
  """
  connectedNetworkDevicePort: String

  """
  The link aggregation group this port is a member of.
  """
  lag: NetworkInterface

  """
  The ports in this link aggregation group.
  """
  lagMembers: [NetworkInterface] @hasInverse(field: lag)
}

"""
A network device: a switch, router, firewall or SD-WAN appliance.

orbIdPattern: {type}-{serialNumber}
"""
type NetworkDevice implements ConfigItem {
  """
  The manufacturer's name.
  """
  manufacturer: String @search(by: [hash])

  """
  The manufacturer's model name.
  """
  model: String @search(by: [term])

  """
  The device's serial number, and the key in its orbId.
  """
  serialNumber: String @search(by: [hash])

  """
  The device's role. One of `tor`, `core`, `mgmt`, `edge`, `leaf`, `spine`,
  `router`, `firewall` or `sd-wan`.
  """
  role: String @search(by: [term])

  """
  The device's MAC address.
  """
  macAddress: String @search(by: [hash])

  """
  The network operating system, e.g. `Junos`.
  """
  platform: String @search(by: [term])

  """
  The device's position in its rack, in rack units.
  """
  rackPosition: Int

  """
  The face of the rack the device is mounted on. One of `front` or `rear`.
  """
  face: String

  """
  The device's member position in its virtual chassis.
  """
  vcPosition: Int

  """
  The device's mastership priority in its virtual chassis.
  """
  vcPriority: Int

  """
  The data center the device is in.
  """
  dataCenter: DataCenter!

  """
  The rack the device is mounted in.
  """
  rack: Rack

  """
  The master of the virtual chassis this device is a member of. Unset for a
  standalone device or the master itself.
  """
  virtualChassis: NetworkDevice

  """
  The members of this device's virtual chassis, when it is the master.
  """
  virtualChassisMembers: [NetworkDevice] @hasInverse(field: virtualChassis)

  """
  The ports this device owns.
  """
  networkInterfaces: [NetworkInterface] @hasInverse(field: networkDevice)

  """
  The ports cabled to this device, seen from their other end.
  """
  networkInterfaceConnectedNetworkDevice: [NetworkInterface] @hasInverse(field: connectedNetworkDevice)
}

"""
A Kubernetes cluster running in a data center.
"""
interface KubernetesCluster {
  """
  The Kubernetes version, e.g. `v1.30.4`.
  """
  kubernetesVersion: String

  """
  The IP address of the cluster's API server endpoint.
  """
  controlPlaneEndpoint: IPAddress

  """
  The container network plugin. One of `cilium`, `calico` or `flannel`.
  """
  cni: String @search(by: [term])

  """
  The environment. One of `prod`, `staging` or `dev`.
  """
  environment: String @search(by: [term])

  """
  A free-text description of the cluster's purpose.
  """
  description: String

  """
  How the cluster is provisioned. One of `eksa`, `maas` or `metal3`.
  """
  provider: String @search(by: [term, hash])

  """
  The data center the cluster runs in.
  """
  dataCenter: DataCenter!

  """
  The cluster's nodes.
  """
  nodes: [KubernetesNode] @hasInverse(field: cluster)

  """
  The cluster's backup configuration.
  """
  backup: ClusterBackup
}

"""
A Kubernetes cluster provisioned by EKS Anywhere.

orbIdPattern: {name}
"""
type EksaKubernetesCluster implements KubernetesCluster & ConfigItem {
  """
  The cluster's role in EKS Anywhere. One of `management`, `standalone` or `workload`.
  """
  clusterType: String @search(by: [term])

  """
  The IP address of the cluster's Tinkerbell provisioning service.
  """
  tinkerbellIP: IPAddress

  """
  The management cluster that manages this workload cluster.
  """
  managementCluster: EksaKubernetesCluster

  """
  The workload clusters this management cluster manages.
  """
  workloadClusters: [EksaKubernetesCluster] @hasInverse(field: managementCluster)
}

"""
A Kubernetes node: a server's membership in a cluster.

orbIdPattern: {name}
"""
type KubernetesNode implements ConfigItem {
  """
  The node's role. One of `control_plane` or `worker`.
  """
  role: String @search(by: [term])

  """
  The node's IP address on the cluster network. Distinct from the server's
  management address.
  """
  ipv4: IPAddress

  """
  Whether the node contributes GPUs to the cluster.
  """
  gpu: Boolean @search

  """
  Who owns the node.
  """
  owner: String @search(by: [term])

  """
  Free-text notes about the node.
  """
  notes: String

  """
  The cluster the node belongs to.
  """
  cluster: KubernetesCluster!

  """
  The server the node runs on.
  """
  server: Server!
}

"""
A cluster's backup configuration: its etcd, Velero and S3 sync settings.

orbIdSuffix: backup
orbIdPattern: {cluster.name}-{type}
"""
type ClusterBackup implements ConfigItem {
  """
  Settings for etcd snapshots.
  """
  etcd: EtcdBackup

  """
  Settings for Velero backups.
  """
  velero: VeleroBackup

  """
  Settings for syncing backups to S3-compatible object storage.
  """
  s3Sync: S3Sync

  """
  The cluster the configuration belongs to.
  """
  cluster: KubernetesCluster! @hasInverse(field: backup)
}

"""
Settings for a cluster's etcd snapshots.

orbIdSuffix: etcd-backup
orbIdPattern: {clusterBackupEtcd.cluster.name}-{type}
"""
type EtcdBackup implements ConfigItem {
  """
  Whether snapshots are taken.
  """
  enabled: Boolean @search

  """
  When snapshots are taken, as a cron expression, e.g. `0 */6 * * *`.
  """
  schedule: String

  """
  Where snapshots are written.
  """
  location: String @search(by: [hash])

  """
  How many days snapshots are kept.
  """
  retentionDays: Int

  """
  The backup configuration these settings belong to.
  """
  clusterBackupEtcd: ClusterBackup! @hasInverse(field: etcd)
}

"""
Settings for a cluster's Velero backups.

orbIdSuffix: velero-backup
orbIdPattern: {clusterBackupVelero.cluster.name}-{type}
"""
type VeleroBackup implements ConfigItem {
  """
  Whether backups are taken.
  """
  enabled: Boolean @search

  """
  When backups are taken, as a cron expression, e.g. `0 2 * * *`.
  """
  schedule: String

  """
  Where backups are written.
  """
  location: String @search(by: [hash])

  """
  How many days backups are kept.
  """
  retentionDays: Int

  """
  The backup configuration these settings belong to.
  """
  clusterBackupVelero: ClusterBackup! @hasInverse(field: velero)
}

"""
Settings for syncing a cluster's backups to S3-compatible object storage.

orbIdSuffix: s3sync
orbIdPattern: {clusterBackupS3Sync.cluster.name}-{type}
"""
type S3Sync implements ConfigItem {
  """
  Whether backups are synced.
  """
  enabled: Boolean @search

  """
  The backup configuration these settings belong to.
  """
  clusterBackupS3Sync: ClusterBackup! @hasInverse(field: s3Sync)
}

"""
An IP address with an assigned role, such as a server's management address or a
cluster's API endpoint.

orbIdPattern: {address}
"""
type IPAddress implements ConfigItem {
  """
  The address family. One of `ipv4` or `ipv6`.
  """
  type: String

  """
  The address, e.g. `10.0.0.12`.
  """
  address: String! @search(by: [hash])

  """
  What the address is for. One of `oob`, `tinkerbell`, `k8s_api` or `k8s_node`.
  """
  role: String @search(by: [term])

  """
  The server using this as its management address.
  """
  serverOobIP: Server

  """
  The cluster using this as its API server endpoint.
  """
  kubernetesClusterControlPlaneEndpoint: KubernetesCluster @hasInverse(field: controlPlaneEndpoint)

  """
  The EKS Anywhere clusters using this as their Tinkerbell address.
  """
  eksaKubernetesClusterTinkerbellIP: [EksaKubernetesCluster] @hasInverse(field: tinkerbellIP)

  """
  The Kubernetes node using this as its cluster-network address.
  """
  kubernetesNodeIPv4: KubernetesNode @hasInverse(field: ipv4)
}
