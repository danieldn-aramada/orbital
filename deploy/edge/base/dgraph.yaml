apiVersion: v1
kind: Service
metadata:
  name: dgraph-zero
spec:
  clusterIP: None
  selector:
    app: dgraph-zero
  ports:
    - name: grpc-zero
      port: 5080
      targetPort: 5080
    - name: http-zero
      port: 6080
      targetPort: 6080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dgraph-zero
spec:
  serviceName: dgraph-zero
  replicas: 1
  selector:
    matchLabels:
      app: dgraph-zero
  template:
    metadata:
      labels:
        app: dgraph-zero
    spec:
      containers:
        - name: zero
          image: dgraph/dgraph:v25.3.1
          imagePullPolicy: Always
          command:
            - dgraph
            - zero
            - --my=dgraph-zero-0.dgraph-zero:5080
          ports:
            - containerPort: 5080
            - containerPort: 6080
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          volumeMounts:
            - name: data
              mountPath: /dgraph
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: rook-ceph-block
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: dgraph-alpha
spec:
  selector:
    app: dgraph-alpha
  ports:
    - name: grpc-internal
      port: 7080
      targetPort: 7080
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc-external
      port: 9080
      targetPort: 9080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dgraph-alpha
spec:
  serviceName: dgraph-alpha
  replicas: 1
  selector:
    matchLabels:
      app: dgraph-alpha
  template:
    metadata:
      labels:
        app: dgraph-alpha
    spec:
      containers:
        - name: alpha
          image: dgraph/dgraph:v25.3.1
          imagePullPolicy: Always
          command:
            - dgraph
            - alpha
            - --my=dgraph-alpha-0.dgraph-alpha:7080
            - --zero=dgraph-zero:5080
            - --graphql
            - extensions=false
            - --security
            - whitelist=0.0.0.0/0
          ports:
            - containerPort: 7080
            - containerPort: 8080
            - containerPort: 9080
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          volumeMounts:
            - name: data
              mountPath: /dgraph
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: rook-ceph-block
        resources:
          requests:
            storage: 10Gi
