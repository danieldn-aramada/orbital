apiVersion: v1
kind: Service
metadata:
  name: zot
  labels:
    app: zot
spec:
  selector:
    app: zot
  ports:
    - name: http
      port: 5000
      targetPort: 5000
---
# Single-replica edge zot. Deployment (not StatefulSet) because:
#   - one pod per edge site; no per-pod identity or clustering needed
#   - zot writes to /var/lib/registry; strategy: Recreate ensures the old pod
#     releases the PVC before the new one attaches (RWO storage class)
#   - if we ever add replicas > 1 for HA, migrate back to StatefulSet with
#     volumeClaimTemplates — Deployment + shared RWX PVC would race writers
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: rook-ceph-block
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zot
  template:
    metadata:
      labels:
        app: zot
    spec:
      containers:
        - name: zot
          image: ghcr.io/project-zot/zot-linux-amd64:v2.1.18
          imagePullPolicy: Always
          command: ["/usr/local/bin/zot-linux-amd64", "serve", "/etc/zot/config.json"]
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: zot-config
              mountPath: /etc/zot/config.json
              subPath: config.json
            - name: acr-creds
              mountPath: /etc/zot/sync-creds.json
              subPath: sync-creds.json
              readOnly: true
            - name: registry-data
              mountPath: /var/lib/registry
      volumes:
        - name: zot-config
          configMap:
            name: zot-config
        - name: acr-creds
          secret:
            secretName: acr-credentials
            items:
              - key: sync-creds.json
                path: sync-creds.json
        - name: registry-data
          persistentVolumeClaim:
            claimName: registry-data
