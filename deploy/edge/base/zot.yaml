apiVersion: v1
kind: Service
metadata:
  name: zot
spec:
  selector:
    app: zot
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zot
spec:
  serviceName: zot
  replicas: 1
  selector:
    matchLabels:
      app: zot
  template:
    metadata:
      labels:
        app: zot
    spec:
      containers:
        - name: zot
          image: ghcr.io/project-zot/zot-linux-amd64:v2.1.9
          imagePullPolicy: Always
          command: ["/usr/local/bin/zot-linux-amd64", "serve", "/etc/zot/config.json"]
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: zot-config
              mountPath: /etc/zot/config.json
              subPath: config.json
            - name: acr-creds
              mountPath: /etc/zot/sync-creds.json
              subPath: sync-creds.json
              readOnly: true
            - name: registry-data
              mountPath: /var/lib/registry
      volumes:
        - name: zot-config
          configMap:
            name: zot-config
        - name: acr-creds
          secret:
            secretName: acr-credentials
            items:
              - key: sync-creds.json
                path: sync-creds.json
  volumeClaimTemplates:
    - metadata:
        name: registry-data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: rook-ceph-block
        resources:
          requests:
            storage: 5Gi
