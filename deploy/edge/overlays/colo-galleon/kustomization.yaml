apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: orb

resources:
  - ../../base
  - registry-data-demo.yaml  # fresh PVC for clean-room v70+ filter test; keeps registry-data as rollback anchor

images:
  - name: armadaeksatest.azurecr.io/orb
    newTag: v0.0.2

configMapGenerator:
  - name: zot-config
    files:
      - config.json=zot-config.json
    options:
      disableNameSuffixHash: true

patches:
  - path: orb-patch.yaml
  - path: zot-pvc-patch.yaml  # point Zot at registry-data-demo (fresh PVC)
