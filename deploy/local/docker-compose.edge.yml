# Edge-data-center simulation stack.
#
# Brings up only the services an edge needs: orb's DGraph + a local zot
# configured to mirror the orbital/colo-galleon repo from upstream ACR.
#
# Mutually exclusive with `make up` (both bind :5001 + :8082 + :9082).
#
# Usage (no Makefile wrappers — invoke compose directly):
#   docker compose -f deploy/local/docker-compose.edge.yml up -d
#   docker compose -f deploy/local/docker-compose.edge.yml down -v

services:
  oci-registry:
    image: ghcr.io/project-zot/zot-linux-arm64:v2.1.9
    container_name: local-oci-registry-1
    command: serve /etc/zot/config.json
    ports:
      - "5001:5000"
    volumes:
      - ./zot-config-edge.json:/etc/zot/config.json:ro
      - ./sync-credentials.json:/etc/zot/sync-credentials.json:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/zot-linux-arm64", "verify", "/etc/zot/config.json"]
      interval: 5s
      timeout: 5s
      retries: 10

  dgraph-orb-zero:
    image: dgraph/dgraph:v25.3.1
    container_name: local-dgraph-orb-zero-1
    command: dgraph zero --my=dgraph-orb-zero:5080
    ports:
      - "5082:5080"
      - "6082:6080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6080/state"]
      interval: 5s
      timeout: 5s
      retries: 10

  dgraph-orb-alpha:
    image: dgraph/dgraph:v25.3.1
    container_name: local-dgraph-orb-alpha-1
    command: >
      dgraph alpha
      --my=dgraph-orb-alpha:7080
      --zero=dgraph-orb-zero:5080
      --graphql extensions=false
      --security whitelist=0.0.0.0/0
    ports:
      - "7082:7080"
      - "8082:8080"
      - "9082:9080"
    depends_on:
      dgraph-orb-zero:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 12

  # orb runs as a container in the edge sim because the dgraph binary it execs
  # for `dgraph live` is Linux-only — can't run via `go run` on macOS. The
  # image is built by `make edge-up` from the local working tree.
  orb:
    image: orb:local
    container_name: local-orb-1
    ports:
      - "8010:8010"
    environment:
      ORB_DGRAPH_URL: http://dgraph-orb-alpha:8080/graphql
      ORB_DGRAPH_ADMIN_URL: http://dgraph-orb-alpha:8080/admin
      ORB_DGRAPH_ALPHA_GRPC: dgraph-orb-alpha:9080
      ORB_DGRAPH_ZERO_GRPC: dgraph-orb-zero:5080
      ORB_OCI_REGISTRY: oci-registry:5000
      ORB_OCI_ALLOW_HTTP: "true"
      ORB_OCI_PUBLIC_KEY_PATH: /app/deploy/local/cosign.pub
      ORB_ENABLE_OCI_REGISTRY: "true"
      ORB_DATA_DIR: /var/lib/orb
      ORB_DEV: "true"
    volumes:
      - ./cosign.pub:/app/deploy/local/cosign.pub:ro
    depends_on:
      dgraph-orb-alpha:
        condition: service_healthy
      oci-registry:
        condition: service_healthy
