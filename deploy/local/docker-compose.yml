services:
  # Blue cluster — live, serves the Topology API
  dgraph-zero:
    image: dgraph/dgraph:v25.3.1
    command: dgraph zero --my=dgraph-zero:5080
    ports:
      - "5080:5080"
      - "6080:6080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6080/state"]
      interval: 5s
      timeout: 5s
      retries: 10

  dgraph-alpha:
    image: dgraph/dgraph:v25.3.1
    command: >
      dgraph alpha
      --my=dgraph-alpha:7080
      --zero=dgraph-zero:5080
      --graphql extensions=false
      --security whitelist=0.0.0.0/0
    ports:
      - "7080:7080"
      - "8080:8080"
      - "9080:9080"
    volumes:
      - ../../.local/exports/blue:/dgraph/export
    depends_on:
      dgraph-zero:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Test cluster — the integration suite's live graph. Exists so `go test
  # -tags=integration` cannot reach the blue cluster above, which is the
  # developer's own working graph. TestMain drop_all's whatever DGraphURL()
  # points at, before test selection, so `-run` never protected it and three
  # separate sessions lost a restored graph to a routine test run.
  #
  # Why a THIRD cluster and not the scratch one: the suite itself needs two
  # graphs, because the export tests exercise blue→green (read from the live
  # graph, stage into scratch, export from there) and Export.wipeScratch
  # drop_all's the scratch target on every run. Pointing the suite's live graph
  # at scratch would wipe shared suite state mid-run.
  dgraph-zero-test:
    image: dgraph/dgraph:v25.3.1
    command: dgraph zero --my=dgraph-zero-test:5080
    ports:
      - "6083:6080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6080/state"]
      interval: 5s
      timeout: 5s
      retries: 10

  dgraph-alpha-test:
    image: dgraph/dgraph:v25.3.1
    command: >
      dgraph alpha
      --my=dgraph-alpha-test:7080
      --zero=dgraph-zero-test:5080
      --graphql extensions=false
      --security whitelist=0.0.0.0/0
    ports:
      - "7083:7080"
      - "8083:8080"
      - "9083:9080"
    volumes:
      - ../../.local/exports/test:/dgraph/export
    depends_on:
      dgraph-zero-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Scratch cluster — isolated, used only for subgraph export
  dgraph-zero-scratch:
    image: dgraph/dgraph:v25.3.1
    command: dgraph zero --my=dgraph-zero-scratch:5080
    ports:
      - "6081:6080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6080/state"]
      interval: 5s
      timeout: 5s
      retries: 10

  dgraph-alpha-scratch:
    image: dgraph/dgraph:v25.3.1
    command: >
      dgraph alpha
      --my=dgraph-alpha-scratch:7080
      --zero=dgraph-zero-scratch:5080
      --graphql extensions=false
      --security whitelist=0.0.0.0/0
    ports:
      - "7081:7080"
      - "8081:8080"
      - "9081:9080"
    volumes:
      - ../../.local/exports/scratch:/dgraph/export
    depends_on:
      dgraph-zero-scratch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 12

  dgraph-ratel:
    image: dgraph/ratel:v25.0.7
    platform: linux/amd64
    ports:
      - "8000:8000"
    depends_on:
      - dgraph-alpha

  postgres:
    image: postgres:18.3-alpine3.23
    environment:
      POSTGRES_USER: orbital
      POSTGRES_PASSWORD: orbital-local-dev-secret
      POSTGRES_DB: orbital
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "orbital", "-d", "orbital"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-setup:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb local/orbital --ignore-existing
      "
    restart: "no"

  oci-registry:
    image: ghcr.io/project-zot/zot-linux-arm64:v2.1.9
    command: serve /etc/zot/config.json
    ports:
      - "5001:5000"
    volumes:
      - ./zot-config.json:/etc/zot/config.json
    healthcheck:
      test: ["CMD", "/usr/local/bin/zot-linux-arm64", "verify", "/etc/zot/config.json"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Orbital server — run the built Docker image against the local stack.
  # Usage: docker build -t orbital:local . && docker compose up orbital
  orbital:
    image: orbital:local
    ports:
      - "8001:8001"
    environment:
      DGRAPH_URL: http://dgraph-alpha:8080/graphql
      DGRAPH_ADMIN_URL: http://dgraph-alpha:8080/admin
      DGRAPH_SCRATCH_URL: http://dgraph-alpha-scratch:8080/graphql
      DGRAPH_SCRATCH_ADMIN_URL: http://dgraph-alpha-scratch:8080/admin
      DGRAPH_SCRATCH_ZERO_URL: http://dgraph-zero-scratch:6080
      DGRAPH_EXPORT_DIR: /dgraph/export
      DGRAPH_SCRATCH_EXPORT_DIR: /dgraph/scratch-export
      DATABASE_URL: postgres://orbital:orbital-local-dev-secret@postgres:5432/orbital?sslmode=disable
      ORBITAL_S3_ENDPOINT: http://minio:9000
      ORBITAL_S3_BUCKET: orbital
      ORBITAL_S3_ACCESS_KEY: minioadmin
      ORBITAL_S3_SECRET_KEY: minioadmin
      ORBITAL_OCI_REGISTRY: oci-registry:5000
      ORBITAL_OCI_ALLOW_HTTP: "true"
      ORBITAL_DGRAPH_ALPHA_GRPC: dgraph-alpha:9080
      ORBITAL_DGRAPH_ZERO_GRPC: dgraph-zero:5080
      # Was ORBITAL_DEV: "true", which meant hot-reload ON and API auth OFF.
      # Split 2026-09-23; both halves stated explicitly so the behaviour is the
      # same and visible. The container runs the EMBEDDED templates, so
      # hot-reload is pointless here — this image has no repo to reload from.
      ORBITAL_API_AUTH_ENABLED: "false"
      # The placeholder key is refused unconditionally (it is published in the
      # repo). A fixed throwaway is fine for a disposable local container.
      ORBITAL_SESSION_HMAC_KEY: "local-compose-only-not-a-real-secret-0123456789abcdef"
      # Route the containerized orbital's bundler calls to cb-bundler running on the host.
      # `localhost` inside the container refers to the container itself; `host.docker.internal`
      # resolves to the host's loopback interface on Docker Desktop.
      ORBITAL_BUNDLER_URLS: configbundle-bundler=http://host.docker.internal:8020/bundle
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../.local/exports/blue:/dgraph/export
      - ../../.local/exports/scratch:/dgraph/scratch-export
      - ./cosign.key:/app/deploy/local/cosign.key:ro
    depends_on:
      postgres:
        condition: service_healthy
      dgraph-alpha:
        condition: service_healthy
      dgraph-alpha-scratch:
        condition: service_healthy
      minio:
        condition: service_healthy
    profiles:
      - orbital

  # Orb edge service — run the built Docker image against the local stack.
  # Usage: docker build --target=orb -t orb:local . && docker compose --profile orb up orb
  # Required for `make release-check` so the import → restore flow exercises
  # the production code path (dgraph live as a subprocess inside the orb container).
  orb:
    image: orb:local
    ports:
      - "8010:8010"
    environment:
      ORB_DGRAPH_URL: http://dgraph-orb-alpha:8080/graphql
      ORB_DGRAPH_ADMIN_URL: http://dgraph-orb-alpha:8080/admin
      ORB_DGRAPH_ALPHA_GRPC: dgraph-orb-alpha:9080
      ORB_DGRAPH_ZERO_GRPC: dgraph-orb-zero:5080
      ORB_OCI_REGISTRY: oci-registry:5000
      ORB_OCI_ALLOW_HTTP: "true"
      ORB_OCI_PUBLIC_KEY_PATH: /app/deploy/local/cosign.pub
      ORB_ENABLE_OCI_REGISTRY: "true"
      ORB_DATA_DIR: /var/lib/orb
      ORB_TEMPLATE_HOT_RELOAD_ENABLED: "false"  # container serves embedded templates
      # No layer consumers in this environment. ORB_CONSUMERS defaults to
      # cb-controller on localhost:8095 — which, inside this container, is the
      # container itself, where nothing is listening. Every dispatch therefore
      # failed with connection-refused and every import finished "partial",
      # permanently, which trained the release-check gate to accept "partial" as
      # normal. Stating the truth here makes a future "partial" mean a REAL
      # dispatch failure. Exercising dispatch needs a stub consumer, which is a
      # separate test, not a default pointing at a process that is not here.
      ORB_CONSUMERS: "[]"
      # S3 for divergence report publishing — points at the compose network's
      # minio service (localhost inside the container is the container itself).
      ORB_S3_ENDPOINT: http://minio:9000
      ORB_S3_BUCKET: orbital
      ORB_S3_ACCESS_KEY: minioadmin
      ORB_S3_SECRET_KEY: minioadmin
    volumes:
      - ./cosign.pub:/app/deploy/local/cosign.pub:ro
    depends_on:
      dgraph-orb-alpha:
        condition: service_healthy
    profiles:
      - orb

  # Orb DGraph — isolated from orbital's blue/scratch instances
  dgraph-orb-zero:
    image: dgraph/dgraph:v25.3.1
    command: dgraph zero --my=dgraph-orb-zero:5080
    ports:
      - "5082:5080"
      - "6082:6080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6080/state"]
      interval: 5s
      timeout: 5s
      retries: 10

  dgraph-orb-alpha:
    image: dgraph/dgraph:v25.3.1
    command: >
      dgraph alpha
      --my=dgraph-orb-alpha:7080
      --zero=dgraph-orb-zero:5080
      --graphql extensions=false
      --security whitelist=0.0.0.0/0
    ports:
      - "7082:7080"
      - "8082:8080"
      - "9082:9080"
    depends_on:
      dgraph-orb-zero:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 12

