apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbital
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: orbital
  template:
    metadata:
      labels:
        app: orbital
      annotations:
        # Istio (prometheusMerge) reads these, scrapes orbital's /metrics, and
        # merges it into the sidecar's :15020 endpoint — which Azure Managed
        # Prometheus (ama-metrics `kubernetespods` job) scrapes cluster-wide via
        # prometheus.io/scrape. This is how orbital_*/http_* metrics reach Grafana
        # inside the mesh; a ServiceMonitor to :8001 would fail on mTLS.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: orbital
          image: armadaeksatest.azurecr.io/orbital
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
          env:
            - name: ORBITAL_PORT
              value: "8001"
            - name: RATEL_URL
              value: "#"
            - name: ORBITAL_BASE_PATH
              value: "/orbital"
            # ORBITAL_DEV was split into per-capability flags on 2026-09-23.
            # Its production value (false) meant: no template hot-reload, API
            # auth on, placeholder session key refused. All three are now the
            # BINARY DEFAULTS, so setting nothing here preserves that exactly.
            # ORBITAL_SESSION_HMAC_KEY still comes from the secret below.
            - name: ORBITAL_API_AUTH_ENABLED
              value: "true"
            # Rate limiting. The code default is OFF so local dev is unthrottled;
            # every real deployment wants it on, and base is where that belongs
            # rather than each overlay remembering. The tighter bucket it attaches
            # to POST /user/login is the only brake on credential guessing —
            # local password login is the break-glass path and cannot be disabled.
            #
            # Per-pod and in-memory, so the effective ceiling is RPS x replicas
            # (deploy/README.md § Known limits). It slows one source; it does not
            # lock accounts, which is deliberate — lockout on a break-glass path
            # is a denial-of-service anyone can trigger with an admin's email.
            - name: ORBITAL_RATE_LIMIT_ENABLED
              value: "true"
            # AKS dev is HTTP-only (no Istio TLS yet). Secure cookies would
            # be silently dropped by the browser over HTTP. Remove this
            # override once HTTPS is configured on the ingress.
            - name: ORBITAL_COOKIE_SECURE
              value: "false"
            - name: ORBITAL_LOG_LEVEL
              value: "info"
            # DGraph — short names resolve to the local namespace via DNS search path.
            # Each overlay deploys DGraph alongside orbital in its own namespace.
            - name: DGRAPH_URL
              value: http://dgraph-blue-dgraph-alpha:8080/graphql
            - name: DGRAPH_ADMIN_URL
              value: http://dgraph-blue-dgraph-alpha:8080/admin
            - name: DGRAPH_SCRATCH_URL
              value: http://dgraph-scratch-dgraph-alpha:8080/graphql
            - name: DGRAPH_SCRATCH_ADMIN_URL
              value: http://dgraph-scratch-dgraph-alpha:8080/admin
            - name: DGRAPH_SCRATCH_ZERO_URL
              value: http://dgraph-scratch-dgraph-zero:6080
            # PostgreSQL — DATABASE_URL supplied by each overlay (dev: secretKeyRef, orbital: in-cluster)
            # Session
            - name: ORBITAL_SESSION_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: orbital-secrets
                  key: ORBITAL_SESSION_HMAC_KEY
            - name: ORBITAL_SESSION_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: orbital-secrets
                  key: ORBITAL_SESSION_ENCRYPTION_KEY
            # OIDC. The issuer, client id and provider list name a SPECIFIC
            # identity provider, so they live in the overlay — base must not
            # point an adopter's deployment at someone else's IdP. Every overlay
            # sets ORBITAL_OIDC_ISSUER_URL, ORBITAL_OIDC_CLIENT_ID and
            # ORBITAL_AUTH_PROVIDERS on this container.
            - name: ORBITAL_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: orbital-secrets
                  key: ORBITAL_OIDC_CLIENT_SECRET
            - name: ORBITAL_OIDC_REDIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: orbital-secrets
                  key: ORBITAL_OIDC_REDIRECT_URL
            # Divergence ingest — override the dev-friendly 10s default.
            - name: ORBITAL_DIVERGENCE_POLL_INTERVAL
              value: 15s
            # Bundlers — UI publish form-encodes; this default supplies the
            # in-pod cb-bundler sidecar so the manifest+mapping layers always
            # get added. JSON callers can still override per-request.
            - name: ORBITAL_BUNDLER_URLS
              value: configbundle-bundler=http://localhost:8020/bundle
            # Backup (Azure Blob)
            - name: ORBITAL_S3_ENDPOINT
              value: https://armadagalleonbackups.blob.core.windows.net
            - name: ORBITAL_S3_BUCKET
              value: orbital
            - name: ORBITAL_S3_ACCESS_KEY
              value: armadagalleonbackups
            - name: ORBITAL_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: orbital-secrets
                  key: ORBITAL_S3_SECRET_KEY
            # OCI
            - name: ORBITAL_OCI_REGISTRY
              value: armadaeksatest.azurecr.io
            - name: ORBITAL_OCI_USERNAME
              value: armadaeksatest
            - name: ORBITAL_OCI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orbital-secrets
                  key: ORBITAL_OCI_PASSWORD
            - name: ORBITAL_OCI_SIGNING_KEY_PATH
              value: /secrets/cosign.key
            - name: ORBITAL_OCI_ALLOW_HTTP
              value: "false"
            - name: DGRAPH_EXPORT_DIR
              value: /dgraph-exports
            - name: DGRAPH_SCRATCH_EXPORT_DIR
              value: /scratch-exports
            - name: ORBITAL_EXPORT_DIR
              value: /scratch-exports/zips
            # Restore — dgraph live runs as a subprocess inside orbital
            - name: ORBITAL_DGRAPH_ALPHA_GRPC
              value: dgraph-blue-dgraph-alpha:9080
            - name: ORBITAL_DGRAPH_ZERO_GRPC
              value: dgraph-blue-dgraph-zero:5080
          volumeMounts:
            - name: cosign-key
              mountPath: /secrets
              readOnly: true
            - name: scratch-exports
              mountPath: /scratch-exports
            - name: dgraph-exports
              mountPath: /dgraph-exports
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
        - name: configbundle-bundler
          image: armadaeksatest.azurecr.io/configbundle-bundler
          imagePullPolicy: Always
          ports:
            - containerPort: 8020
          env:
            - name: BUNDLER_PORT
              value: "8020"
            # Mirror orbital's base path so the bundler's GraphQL URL stays in
            # sync if it ever changes. K8s expands $(VAR) in env values.
            # Single base URL — cb-bundler derives /graphql and /api/v1/...
            # from this. Must include orbital's base path.
            - name: ORBITAL_BASE_PATH
              value: /orbital
            - name: ORBITAL_BASE_URL
              value: http://localhost:8001$(ORBITAL_BASE_PATH)
            # OAuth2 client credentials grant — cb-bundler mints its own bearer
            # token to call orbital's /graphql, as the armada-orbital service
            # account. Keycloak, not Entra: orbital trusts one issuer now.
            # Same secret as the orbital container (single K8s Secret on both).
            # Env var names must match what cb-bundler reads (ORBITAL_OIDC_*).
            #
            # The token carries no email, so orbital treats it as an app
            # principal: no user row. The gate is the provider entry's clientID
            # in ORBITAL_AUTH_PROVIDERS — a token whose azp matches no entry is
            # refused, so this client must appear there.
            # Issuer, client id and token URL name a specific provider, so the
            # overlay sets them — same rule as the orbital container above.
            - name: ORBITAL_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: orbital-secrets
                  key: ORBITAL_OIDC_CLIENT_SECRET
            # A token endpoint is not derivable from the issuer the way Entra's
            # was, and Keycloak does not recognise Entra's
            # api://{clientID}/.default scope, so cb-bundler takes both
            # explicitly. TOKEN_SCOPE is provider-independent; TOKEN_URL is not
            # and lives in the overlay.
            - name: ORBITAL_TOKEN_SCOPE
              value: openid
      volumes:
        - name: cosign-key
          secret:
            secretName: orbital-secrets
            items:
              - key: cosign.key
                path: cosign.key
        - name: scratch-exports
          persistentVolumeClaim:
            claimName: orbital-scratch-exports
        - name: dgraph-exports
          persistentVolumeClaim:
            claimName: orbital-dgraph-exports
---
apiVersion: v1
kind: Service
metadata:
  name: orbital
spec:
  selector:
    app: orbital
  ports:
    - port: 8001
      targetPort: 8001
  type: ClusterIP
