---
# Shared PVC used by orbital (to download/extract backup) and dgraph-live (to run dgraph live).
# Both pods must be in the same namespace for RWO access.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: orbital-restore-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
