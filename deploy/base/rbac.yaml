---
# Role: allow orbital to list and exec into dgraph-live pod for restore operations.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orbital-dgraph-restore
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
# RoleBinding: bind the role to orbital's service account.
# kustomize namespace transformer updates metadata.namespace and subjects[].namespace automatically.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orbital-dgraph-restore
subjects:
  - kind: ServiceAccount
    name: default
    namespace: netbox  # kustomize updates this when namespace: is set in the overlay
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: orbital-dgraph-restore
