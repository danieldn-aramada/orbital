apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: orbital
resources:
  - ../../base
  - postgres.yaml
  - secrets.yaml  # gitignored — copy from deploy/dev/secrets.yaml, update ORBITAL_OIDC_REDIRECT_URL
images:
  - name: armadaeksatest.azurecr.io/orbital
    newTag: v0.0.14

patches:
