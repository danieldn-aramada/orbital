# Grafana dashboard provider — loads every JSON under the mounted dir on boot,
# so the dashboard is reconstructed from its ConfigMap on every restart (no PVC,
# durable-by-provisioning). The JSON comes from the orbital-grafana-dashboards
# ConfigMap (generated from orbital-dashboard.json).
apiVersion: 1
providers:
  - name: orbital
    orgId: 1
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    options:
      path: /etc/orbital-dashboards
      foldersFromFilesStructure: false
