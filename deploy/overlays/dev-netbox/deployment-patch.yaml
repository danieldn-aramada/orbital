apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbital
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: orbital
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: orbital
      containers:
        - name: orbital
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: orbital-secrets
                  key: DATABASE_URL
            - name: ORBITAL_ADMIN_EMAILS
              value: "admin@armada.ai"
            - name: ORBITAL_BACKUP_SCHEDULE
              value: "0 8 * * *"  # daily at 08:00 UTC (midnight PT)
            - name: ORBITAL_DIVERGENCE_POLL_INTERVAL
              value: "5s"
            # External-JWT auth for AEP — trusts Keycloak bearers issued FOR
            # orbital. `aud` is the trust anchor: an audience mapper on the
            # aep-fleet-commander client adds "armada-orbital", so the token is
            # addressed to orbital rather than carrying Keycloak's realm-wide
            # default of "account". ORBITAL_JWT_CLIENT_ID (azp) is kept as
            # defence in depth, not as the anchor — it would change under
            # RFC 8693 token exchange, where azp becomes the exchanging client.
            # All valid tokens still map to admin (AEP enforces authz upstream);
            # tighten by granting per-user roles and lowering
            # ORBITAL_JWT_DEFAULT_ROLE to readonly. UI still works via session
            # fallback. See docs/reference/AUTH.md § External JWT mode.
            - name: ORBITAL_AUTH_MODE
              value: "external-jwt"
            - name: ORBITAL_JWT_ISSUER
              value: "https://keycloak.devnew.armada.ai/realms/armada"
            - name: ORBITAL_JWT_AUDIENCE
              value: "armada-orbital"
            - name: ORBITAL_JWT_CLIENT_ID
              value: "aep-fleet-commander"
            - name: ORBITAL_JWT_DEFAULT_ROLE
              value: "admin"
