apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbital
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: orbital
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: orbital
      containers:
        - name: orbital
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: orbital-secrets
                  key: DATABASE_URL
            - name: ORBITAL_ADMIN_EMAILS
              value: "admin@armada.ai"
            - name: ORBITAL_BACKUP_SCHEDULE
              value: "0 8 * * *"  # daily at 08:00 UTC (midnight PT)
            - name: ORBITAL_DIVERGENCE_POLL_INTERVAL
              value: "5s"
            # Bearer auth: one Keycloak realm, two clients treated differently.
            # A token selects its provider by (iss, azp), so AEP and orbital's
            # own client share an issuer without sharing a policy.
            #
            #  - aep-fleet-commander is a TRUSTED SERVICE: AEP authenticates and
            #    authorizes its own users upstream (organization-svc) and calls
            #    orbital on their behalf, so every valid token gets admin and no
            #    user row is created. The acting client is recorded on audit
            #    events as `acting_client`, so the log distinguishes "AEP acting
            #    as someone" from that person acting directly.
            #  - armada-orbital covers direct callers: the in-pod cb-bundler
            #    (client credentials, no email, so an app principal) and any
            #    human, whose role comes from the orbital_roles claim.
            #    defaultRole alongside roleMapping is the FLOOR: a token matching
            #    no mapped group gets readonly instead of being refused. Applied
            #    authoritatively, so losing a group demotes to the floor rather
            #    than keeping the role the mapping gave. Drop defaultRole to make
            #    an unmatched login a refusal instead.
            #
            # Replaces ORBITAL_AUTH_MODE=external-jwt. The two are mutually
            # exclusive and setting both is a startup error.
            # See docs/reference/AUTH.md § Multiple identity providers.
            - name: ORBITAL_AUTH_PROVIDERS
              value: |
                [
                  {
                    "issuer": {
                      "url": "https://keycloak.devnew.armada.ai/realms/armada",
                      "audiences": ["armada-orbital"]
                    },
                    "clientID": "aep-fleet-commander",
                    "claimMappings": { "username": { "claim": "email" } },
                    "trustedService": { "assignedRole": "admin" }
                  },
                  {
                    "issuer": {
                      "url": "https://keycloak.devnew.armada.ai/realms/armada",
                      "audiences": ["account", "armada-orbital"]
                    },
                    "clientID": "armada-orbital",
                    "claimMappings": {
                      "username": { "claim": "email" },
                      "groups": { "claim": "orbital_roles" }
                    },
                    "roleMapping": [
                      { "group": "orbital-admin", "role": "admin" }
                    ],
                    "defaultRole": "readonly"
                  }
                ]
