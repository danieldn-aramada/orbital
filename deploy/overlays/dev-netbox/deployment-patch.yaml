apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbital
spec:
  template:
    spec:
      containers:
        - name: orbital
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: orbital-secrets
                  key: DATABASE_URL
            - name: ORBITAL_ADMIN_EMAILS
              value: "admin@armada.ai"
            - name: ORBITAL_BACKUP_SCHEDULE
              value: "0 8 * * *"  # daily at 08:00 UTC (midnight PT)
            - name: ORBITAL_DIVERGENCE_POLL_INTERVAL
              value: "5s"
            # External-JWT auth for the AEP demo — trusts Keycloak bearers from
            # the aep-fleet-commander client. azp is the trust anchor (aud is the
            # generic "account"). All valid tokens map to admin; AEP enforces
            # authz upstream. UI still works via session fallback. See
            # docs/reference/AUTH.md § External JWT mode.
            - name: ORBITAL_AUTH_MODE
              value: "external-jwt"
            - name: ORBITAL_JWT_ISSUER
              value: "https://keycloak.devnew.armada.ai/realms/armada"
            - name: ORBITAL_JWT_AUDIENCE
              value: "account"
            - name: ORBITAL_JWT_CLIENT_ID
              value: "aep-fleet-commander"
            - name: ORBITAL_JWT_DEFAULT_ROLE
              value: "admin"
