apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbital
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: orbital
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: orbital
      containers:
        - name: orbital
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: orbital-secrets
                  key: DATABASE_URL
            - name: ORBITAL_ADMIN_EMAILS
              value: "admin@armada.ai"
            - name: ORBITAL_BACKUP_SCHEDULE
              value: "0 8 * * *"  # daily at 08:00 UTC (midnight PT)
            - name: ORBITAL_DIVERGENCE_POLL_INTERVAL
              value: "5s"
            - name: ORBITAL_OIDC_ISSUER_URL
              value: https://keycloak.devnew.armada.ai/realms/armada
            - name: ORBITAL_OIDC_CLIENT_ID
              value: armada-orbital
            # Bearer auth: one Keycloak realm, three clients, different policies.
            # A token selects its provider by (iss, azp).
            #
            #  - aep-fleet-commander: authorization delegated upstream. Every valid
            #    token gets admin, no user row; audit records `acting_client`.
            #
            #  - armada-orbital: direct callers (cb-bundler, humans). Role comes from
            #    the orbital_roles claim; defaultRole is the floor for a token that
            #    matches no mapped group — drop it to refuse those instead.
            #
            #  - armada-firmware-svc: firmware-svc, read-only, client credentials.
            #    Two deviations from the entry above, both load-bearing:
            #    username comes from `preferred_username` because a
            #    client-credentials token carries no `email` and orbital REFUSES a
            #    token whose username claim resolves empty; and the role is
            #    delegated rather than defaultRole, because RequireRole checks the
            #    context role BEFORE the app-principal branch — and that branch
            #    treats any app principal as dev-equivalent, so defaultRole would
            #    never be consulted and the caller would get write access.
            #
            # See docs/reference/AUTH.md § Multiple identity providers.
            - name: ORBITAL_AUTH_PROVIDERS
              value: |
                [
                  {
                    "issuer": {
                      "url": "https://keycloak.devnew.armada.ai/realms/armada",
                      "audiences": ["armada-orbital"]
                    },
                    "clientID": "aep-fleet-commander",
                    "claimMappings": { "username": { "claim": "email" } },
                    "delegatedAuthorization": { "role": "admin" }
                  },
                  {
                    "issuer": {
                      "url": "https://keycloak.devnew.armada.ai/realms/armada",
                      "audiences": ["armada-orbital"]
                    },
                    "clientID": "armada-orbital",
                    "claimMappings": {
                      "username": { "claim": "email" },
                      "groups": { "claim": "orbital_roles" }
                    },
                    "roleMapping": [
                      { "group": "orbital-admin", "role": "admin" }
                    ],
                    "defaultRole": "readonly"
                  },
                  {
                    "issuer": {
                      "url": "https://keycloak.devnew.armada.ai/realms/armada",
                      "audiences": ["armada-orbital"]
                    },
                    "clientID": "armada-firmware-svc",
                    "claimMappings": { "username": { "claim": "preferred_username" } },
                    "delegatedAuthorization": { "role": "readonly" }
                  }
                ]
        # cb-bundler mints its own token against the same realm to call orbital's
        # /graphql during publish
        - name: configbundle-bundler
          env:
            - name: ORBITAL_OIDC_ISSUER_URL
              value: https://keycloak.devnew.armada.ai/realms/armada
            - name: ORBITAL_OIDC_CLIENT_ID
              value: armada-orbital
            - name: ORBITAL_TOKEN_URL
              value: https://keycloak.devnew.armada.ai/realms/armada/protocol/openid-connect/token
