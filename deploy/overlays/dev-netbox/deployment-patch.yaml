apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbital
spec:
  template:
    spec:
      containers:
        - name: orbital
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: orbital-secrets
                  key: DATABASE_URL
            - name: ORBITAL_ADMIN_EMAILS
              value: "admin@armada.ai"
            - name: ORBITAL_BACKUP_SCHEDULE
              value: "0 8 * * *"  # daily at 08:00 UTC (midnight PT)
