definitions:
  orb.DispatchResult:
    properties:
      consumerName:
        description: name of the accepting consumer; empty if no 2xx
        type: string
      error:
        type: string
      mediaType:
        type: string
      statusCode:
        type: integer
      url:
        type: string
    type: object
  orb.ImportRecord:
    properties:
      dcOrbId:
        type: string
      digest:
        type: string
      error:
        type: string
      exportJobId:
        type: string
      importedAt:
        type: string
      layers:
        items:
          $ref: '#/definitions/orb.LayerRecord'
        type: array
      status:
        description: '"done" | "failed"'
        type: string
      tag:
        type: string
      verification:
        description: Verification* constant
        type: string
    type: object
  orb.LayerRecord:
    properties:
      digest:
        type: string
      dispatch:
        allOf:
        - $ref: '#/definitions/orb.DispatchResult'
        description: set when Role == LayerRoleDispatched
      mediaType:
        type: string
      producer:
        description: from OCI annotation com.armada.orbital.producer (empty for legacy)
        type: string
      role:
        description: LayerRole* constant
        type: string
      sizeBytes:
        type: integer
    type: object
  orbserver.importSnapshot:
    properties:
      availableVersion:
        type: string
      currentVersion:
        type: string
      lastChecked:
        type: string
      lastError:
        type: string
      lastImport:
        $ref: '#/definitions/orb.ImportRecord'
      status:
        type: string
    type: object
  orbserver.tagInfo:
    properties:
      digest:
        type: string
      name:
        type: string
      sizeBytes:
        type: integer
      verified:
        type: boolean
    type: object
info:
  contact: {}
  description: Edge service API for orb — air-gap ready config serving and divergence
    reporting.
  title: Orb API
  version: 0.0.0-dev
paths:
  /api/v1/import:
    post:
      consumes:
      - application/json
      description: Starts an async OCI artifact pull and DGraph import for the requested
        tag. Returns 409 if an import is already running.
      parameters:
      - description: Import request
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Trigger import
      tags:
      - import
  /api/v1/import/artifact:
    post:
      consumes:
      - multipart/form-data
      description: Accepts a zip bundle (data.json.gz + schema.gz + optional layers.json
        + layer blobs)
      parameters:
      - description: Zip archive containing data.json.gz, schema.gz, and optionally
          layers.json + layer blobs
        in: formData
        name: bundle
        required: true
        type: file
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Import OCI artifact bundle
      tags:
      - import
  /api/v1/import/history:
    get:
      description: Returns the rolling history of completed and failed imports from
        disk.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/orb.ImportRecord'
            type: array
      summary: Import history
      tags:
      - import
  /api/v1/import/history/{tag}/layers:
    get:
      description: Returns an HTML fragment rendering the layers modal for an import-history
        record, found by tag (newest match wins).
      parameters:
      - description: Import tag
        in: path
        name: tag
        required: true
        type: string
      produces:
      - text/html
      responses:
        "200":
          description: OK
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Import layers modal
      tags:
      - import
  /api/v1/import/status:
    get:
      description: Returns the current import state snapshot including status, current
        version, and last import record.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/orbserver.importSnapshot'
      summary: Import status
      tags:
      - import
  /api/v1/import/subgraph:
    post:
      consumes:
      - multipart/form-data
      description: 'Accepts a zip bundle (data.json.gz + schema.gz) and imports it
        into local DGraph. Source-agnostic: use for courier (direct upload), ConfigBundle
        Controller delivery, or any caller with a subgraph zip.'
      parameters:
      - description: Zip archive containing data.json.gz and schema.gz
        in: formData
        name: bundle
        required: true
        type: file
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Import subgraph bundle
      tags:
      - import
  /api/v1/import/tags:
    get:
      description: Lists available OCI artifact tags from the configured registry
        for this data center, enriched with signature verification status and artifact
        size.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/orbserver.tagInfo'
              type: array
            type: object
      summary: List import tags
      tags:
      - import
  /graphql:
    post:
      consumes:
      - application/json
      description: 'POST: proxies GraphQL queries to orb''s local DGraph instance.
        GET: serves the GraphiQL explorer UI.'
      parameters:
      - description: GraphQL request body
        example: '"{\"query\": \"{ queryServer { id hostname } }\"}"'
        in: body
        name: body
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: GraphQL endpoint
      tags:
      - graphql
swagger: "2.0"
tags:
- name: import
- name: graphql
