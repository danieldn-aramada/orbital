        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Approve a change request
      tags:
      - change-requests
  /api/v1/change-requests/{id}/close:
    post:
      parameters:
      - description: Change request ID
        in: path
        name: id
        required: true
