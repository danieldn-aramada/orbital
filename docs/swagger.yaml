          have a retrievable digest.
        in: query
        name: status
        type: string
      - description: Max results (default 100, max 500)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.artifactResponse'
            type: array
      summary: List OCI artifacts
      tags:
      - oci
  /api/v1/oci/artifacts/{id}:
