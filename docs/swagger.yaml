      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.changeRequestResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Reject a change request
      tags:
      - change-requests
  /api/v1/config-items/{type}/{id}:
