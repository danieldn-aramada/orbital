        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.artifactResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Get OCI artifact
      tags:
      - oci
  /api/v1/oci/artifacts/{id}/layers:
    get:
      description: Returns an HTML fragment rendering the layers modal for the given
        artifact.
