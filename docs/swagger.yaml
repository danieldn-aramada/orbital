        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Get OCI signing public key
      tags:
      - oci
  /api/v1/oci/test-connection:
    post:
      description: 'Pings the configured OCI registry to verify credentials and reachability.
        Returns {"ok": true} on success or {"ok": false, "error": "..."} on failure.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Test OCI registry connection
      tags:
      - oci
  /api/v1/restore:
    post:
      consumes:
      - application/json
      description: Restores DGraph blue from a stored backup. Blocked if any backup,
        export, or restore job is in progress.
      parameters:
      - description: Restore request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.restoreRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handler.triggerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Trigger a DGraph restore
      tags:
      - backup
  /api/v1/restore/jobs:
    get:
      description: Returns up to 50 restore jobs ordered by most recent first.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.restoreJobResponse'
            type: array
      summary: List restore jobs
      tags:
      - backup
  /api/v1/restore/jobs/{jobId}:
    get:
      description: Returns the status of a specific restore job.
      parameters:
      - description: Restore job ID
        in: path
        name: jobId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.restoreJobResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Get restore job status
      tags:
      - backup
  /api/v1/users:
    get:
      description: Returns all users in the orbital user table. Admin only.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: List users
      tags:
      - users
  /api/v1/users/{id}/role:
    put:
      consumes:
      - application/json
      description: Changes a user's role. Accepts `readonly`, `dev`, or `admin`. Admin
        only. Returns 409 if changing the role would leave zero admins (last-admin
        guard).
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: New role
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.updateRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.userItem'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Update user role
      tags:
      - users
  /graphql:
    post:
      consumes:
      - application/json
      description: 'POST: proxies GraphQL queries and mutations to DGraph. GET: serves
        the GraphiQL explorer UI.'
      parameters:
      - description: GraphQL request body
        example: '"{\"query\": \"{ queryDataCenter { id name } }\"}"'
        in: body
        name: body
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: GraphQL endpoint
      tags:
      - graphql
swagger: "2.0"
