definitions:
  graphdiff.Change:
    properties:
      change:
        description: '"added" | "removed" | "modified"'
        type: string
      fields:
        items:
          $ref: '#/definitions/graphdiff.FieldChange'
        type: array
      orbId:
        type: string
      type:
        type: string
    type: object
  graphdiff.FieldChange:
    properties:
      after: {}
      before: {}
      field:
        type: string
    type: object
  graphdiff.Summary:
    properties:
      added:
        type: integer
      modified:
        type: integer
      removed:
        type: integer
      unchanged:
        type: integer
    type: object
  handler.amendChangeRequestBody:
    properties:
      changes:
        items:
          $ref: '#/definitions/handler.changeItemBody'
        type: array
      description:
        example: Rescheduled to the Dec window.
        type: string
      namespace:
        example: alaska-dot
        type: string
      title:
        example: Enable SSH on the Anchorage iDRACs
        type: string
    type: object
  handler.approvalPolicyBody:
    properties:
      bypassRoles:
        description: |-
          BypassRoles may write this class directly, recorded as a privileged write.
          Defaults to ["admin"]. Bypass is a property of the policy, not of a user.
        example:
        - admin
        items:
          type: string
        type: array
      enabled:
        description: Enabled turns the policy off without deleting it. Default true.
        example: true
        type: boolean
      namespace:
        description: Namespace the policy governs.
        example: alaska-dot
        type: string
      requiredApprovals:
        description: RequiredApprovals is how many distinct reviewers must approve.
          Default 1.
        example: 1
        type: integer
      type:
        description: TypeName narrows the policy to one ConfigItem type. Empty means
          every type.
        example: Server
        type: string
    required:
    - namespace
    type: object
  handler.approvalPolicyResolveResponse:
    properties:
      bypassRoles:
        items:
          type: string
        type: array
      callerMayBypass:
        description: CallerMayBypass is the verdict for THIS caller, already computed.
        example: false
        type: boolean
      enforced:
        description: |-
          Enforced reports whether a direct mutation would actually be refused.
          A client labelling its save button should read Required to decide what to
          OFFER, and Enforced to know whether saving directly would still succeed.
        example: false
        type: boolean
      notice:
        description: |-
          Notice explains a policy that is recorded but not yet enforced. Absent
          once enforcement is live.
        type: string
      required:
        description: |-
          Required reports whether a POLICY demands approval for this class. It
          describes the policy, not what orbital will do — see Enforced.
        example: true
        type: boolean
      requiredApprovals:
        example: 1
        type: integer
    type: object
  handler.approvalPolicyResponse:
    properties:
      actionType:
        example: config.mutation
        type: string
      bypassRoles:
        items:
          type: string
        type: array
      enabled:
        description: 'Enabled is the admin''s switch: turn a policy off without deleting
          it.'
        example: true
        type: boolean
      enforced:
        description: |-
          Enforced reports whether orbital's write path actually REFUSES a
          mutation this policy covers. Distinct from Enabled, which is only what
          the admin asked for. Both must be true for the class to be protected.
        example: false
        type: boolean
      id:
        example: 7c2e1f88-1a2b-4c3d-8e9f-0a1b2c3d4e5f
        type: string
      namespace:
        example: alaska-dot
        type: string
      notice:
        description: |-
          Notice explains a policy that is recorded but not yet enforced. Absent
          once enforcement is live.
        type: string
      requiredApprovals:
        example: 1
        type: integer
      type:
        example: Server
        type: string
    type: object
  handler.approvalResponse:
    properties:
      approver:
        example: reviewer@armada.ai
        type: string
      at:
        type: string
      comment:
        type: string
      current:
        description: |-
          Current is false when the decision was cast against an earlier version of
          the intent and no longer counts — surfaced rather than hidden so the UI
          can say "approved an earlier version" instead of the approval vanishing.
        example: true
        type: boolean
      decision:
        example: approved
        type: string
    type: object
  handler.artifactRef:
    properties:
      dataCenterName:
        example: colo-galleon
        type: string
      digest:
        example: sha256:81147a187a8f
        type: string
      id:
        example: 42
        type: integer
      publishedAt:
        type: string
      tag:
        example: v2
        type: string
    type: object
  handler.artifactResponse:
    properties:
      bundlerError:
        type: string
      completedAt:
        type: string
      datacenterId:
        type: string
      datacenterName:
        type: string
      digest:
        type: string
      enriched:
        type: boolean
      error:
        type: string
      exportJobId:
        type: string
      id:
        type: integer
      initiatedAt:
        type: string
      layers:
        items:
          $ref: '#/definitions/ocitype.ArtifactLayer'
        type: array
      registry:
        type: string
      repository:
        type: string
      signed:
        type: boolean
      signingKeyFingerprint:
        type: string
      sizeBytes:
        type: integer
      status:
        type: string
      tag:
        type: string
    type: object
  handler.auditLogResponse:
    properties:
      events:
        items:
          $ref: '#/definitions/handler.eventItem'
        type: array
      total:
        description: Total is the count of events matching the filters, ignoring limit/offset.
        example: 42
        type: integer
    type: object
  handler.backupRequest:
    properties:
      trigger:
        description: |-
          Trigger records what initiated the backup: "manual" (default) or
          "scheduled". Optional — an empty body is treated as "manual".
        example: manual
        type: string
    type: object
  handler.backupResponse:
    properties:
      checksum:
        type: string
      completedAt:
        type: string
      error:
        type: string
      id:
        type: string
      initiatedAt:
        type: string
      initiatedBy:
        type: string
      s3Key:
        type: string
      sizeBytes:
        type: integer
      status:
        type: string
      trigger:
        type: string
    type: object
  handler.changeItemBody:
    properties:
      clear:
        description: Clear is the fields to unset.
        example:
        - oobMAC
        items:
          type: string
        type: array
      op:
        description: |-
          Op is one of upsert, update, delete. Explicit, never inferred — a request
          approved as an update must not silently become a create.
        example: update
        type: string
      orbId:
        description: OrbID identifies the target. Globally unique, which is why Type
          is optional.
        example: alaska-dot:server-4FK8K44
        type: string
      set:
        additionalProperties: {}
        description: |-
          Set is the fields to write. Edge fields carry only a reference:
          {"dataCenter": {"orbId": "alaska-dot:dc-01"}}.
        type: object
      type:
        description: |-
          Type is the ConfigItem type. Optional for an existing entity (orbital
          resolves it from OrbID); REQUIRED when creating one that does not exist.
        example: Server
        type: string
    required:
    - op
    - orbId
    type: object
  handler.changeRequestDiffResponse:
    properties:
      baseHash:
        description: BaseHash is the hash captured when the request was opened.
        example: sha256:045b8a51a0aea59fa
        type: string
      changes:
        description: Changes is FLAT — one entry per changed entity, never a nested
          tree.
        items:
          $ref: '#/definitions/graphdiff.Change'
        type: array
      contentHash:
        description: ContentHash is the hash of current intent over this request's
          scope.
        example: sha256:045b8a51a0aea59fa
        type: string
      stale:
        description: |-
          Stale means the base moved; the diff below is against CURRENT intent, so
          it already reflects that.
        example: false
        type: boolean
      summary:
        $ref: '#/definitions/graphdiff.Summary'
    type: object
  handler.changeRequestListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/handler.changeRequestResponse'
        type: array
      total:
        description: |-
          Total is the number of matching requests. Drives the "awaiting my review"
          nav badge — there is no separate count endpoint.
        example: 3
        type: integer
    type: object
  handler.changeRequestResponse:
    properties:
      actionType:
        example: config.mutation
        type: string
      approvals:
        description: |-
          Approvals is how many currently-counting approvals exist, and Required is
          how many the policy demands. Required 0 means nothing governs this change.
        example: 0
        type: integer
      author:
        example: proposer@armada.ai
        type: string
      availableActions:
        description: |-
          AvailableActions is the caller-relative verdict: approve, reject, merge,
          edit, close.
        items:
          type: string
        type: array
      changes:
        items:
          $ref: '#/definitions/handler.changeItemBody'
        type: array
      createdAt:
        type: string
      description:
        type: string
      executedAt:
        type: string
      executedBy:
        type: string
      id:
        example: 4b1f0f7a-6f0c-4a1e-9a2e-2f1c7a0b1234
        type: string
      mergeAttempts:
        items:
          $ref: '#/definitions/handler.mergeAttemptResult'
        type: array
      missingTargets:
        description: |-
          MissingTargets are entities that existed when this request was opened and
          have since been deleted. A merge will fail with TARGET_MISSING.
        items:
          type: string
        type: array
      namespace:
        example: alaska-dot
        type: string
      requiredApprovals:
        example: 1
        type: integer
      reviews:
        items:
          $ref: '#/definitions/handler.approvalResponse'
        type: array
      stale:
        description: |-
          Stale means the intent this request was written against has changed since
          it was opened. Derived on every read — never a stored column.
        example: false
        type: boolean
      status:
        description: |-
          Status is the EFFECTIVE status: open, approved, rejected, merged, closed.
          `approved` is derived from the valid-approval count, so it can revert to
          `open` on its own when the base moves.
        example: open
        type: string
      title:
        example: Enable SSH on the Anchorage iDRACs
        type: string
      updatedAt:
        type: string
    type: object
  handler.changesetProblem:
    properties:
      field:
        example: hostnmae
        type: string
      hint:
        type: string
      index:
        description: |-
          Index is the item's position in changes[], so a client can point at the
          offending row instead of making the user re-read the whole changeset.
        example: 0
        type: integer
      message:
        example: no such field on Server
        type: string
      orbId:
        example: alaska-dot:server-4FK8K44
        type: string
    type: object
  handler.compareResponse:
    properties:
      byType:
        additionalProperties:
          $ref: '#/definitions/graphdiff.Summary'
        type: object
      changes:
        items:
          $ref: '#/definitions/graphdiff.Change'
        type: array
      from:
        $ref: '#/definitions/handler.artifactRef'
      summary:
        $ref: '#/definitions/graphdiff.Summary'
      to:
        $ref: '#/definitions/handler.artifactRef'
    type: object
  handler.createChangeRequestBody:
    properties:
      changes:
        description: Changes is the target end-state, one entry per entity.
        items:
          $ref: '#/definitions/handler.changeItemBody'
        type: array
      description:
        description: Description is optional free text — why, and anything a reviewer
          needs.
        example: Requested by field ops for the Nov maintenance window.
        type: string
      namespace:
        description: Namespace scopes the whole request. Every orbId in changes must
          be in it.
        example: alaska-dot
        type: string
      title:
        description: Title is the one-line summary reviewers see in the queue.
        example: Enable SSH on the Anchorage iDRACs
        type: string
    required:
    - changes
    - namespace
    - title
    type: object
  handler.currentMeta:
    properties:
      contentHash:
        example: sha256:abc
        type: string
      nodeCount:
        example: 663
        type: integer
      source:
        example: blue
        type: string
    type: object
  handler.decisionBody:
    properties:
      comment:
        example: Checked against the maintenance window.
        type: string
    type: object
  handler.entryItem:
    properties:
      dcOrbId:
        type: string
      entryOrbId:
        type: string
      field:
        type: string
      firstSeenAt:
        type: string
      id:
        type: string
      intendedValue:
        type: object
      lastSeenAt:
        type: string
      overrideValue:
        type: object
      resolution:
        allOf:
        - $ref: '#/definitions/handler.resolutionItem'
        description: Resolution is the current decision on this entry, if any. Nil
          when un-resolved.
      who:
        type: string
    type: object
  handler.errorResponse:
    properties:
      code:
        example: FORBIDDEN
        type: string
      docUrl:
        type: string
      error:
        example: dev or admin role required for mutations
        type: string
      hint:
        example: Ask an admin to grant you the dev role.
        type: string
      httpStatus:
        example: 403
        type: integer
    type: object
  handler.eventItem:
    properties:
      actor:
        example: asharma@armada.ai
        type: string
      changes:
        description: |-
          Changes is the pre-computed field-level diff. **Present ONLY for a clean
          single-entity update** (omitted otherwise via omitempty) — so its presence
          is the client's signal that a field diff is available; no need to inspect
          operations/before. Server-managed metadata (version/updatedAt/updatedBy/…)
          and DGraph UIDs are already excluded. Same data the UI's colored diff renders.
        items:
          $ref: '#/definitions/handler.fieldChange'
        type: array
      details:
        description: raw {operationName, query, variables, before}
        type: object
      eventCategory:
        description: data | management | auth
        example: data
        type: string
      id:
        example: 3d6bb15f-8c4c-45f0-8a6c-939b6f9cc512
        type: string
      operations:
        description: DGraph mutation fields, e.g. ["updateVeleroBackup"]
        items:
          type: string
        type: array
      resourceIds:
        description: orbIds touched
        items:
          type: string
        type: array
      resourceTypes:
        description: ConfigItem types touched, e.g. ["VeleroBackup"]
        items:
          type: string
        type: array
      timestamp:
        example: "2026-07-29T17:26:55Z"
        type: string
    type: object
  handler.exportRequest:
    properties:
      download:
        description: |-
          Download selects the mode. false (default) exports and publishes to OCI,
          discarding the zip on completion. true exports only and retains the zip
          for GET /api/v1/export/jobs/{jobId}/download.
        example: false
        type: boolean
      expectedContentHash:
        description: |-
          ExpectedContentHash is the optional guarded-Apply token: pass the
          `current.contentHash` from a prior POST /api/v1/export/preview and the
          export aborts with 409 if the data center's desired state changed since
          that preview (another writer edited intent in the review→Apply gap).
          Omit for last-writer-wins (default, back-compatible). This is the
          ETag/If-Match pattern applied to a whole subgraph — one hash rather than
          per-node version checks, so concurrent ADDS and DELETES are caught too.
        example: sha256:045b8a51a0aea59fa
        type: string
      orbId:
        description: OrbID identifies the data center to export, in "namespace:name"
          form. Required.
        example: alaska:dc-01
        type: string
    required:
    - orbId
    type: object
  handler.fieldChange:
    properties:
      after:
        description: new value (e.g. 15)
        type: object
      before:
        description: old value (e.g. 7)
        type: object
      field:
        example: retentionDays
        type: string
    type: object
  handler.lastPublishedMeta:
    properties:
      digest:
        example: sha256:1a2b
        type: string
      exportJobId:
        type: string
      publishedAt:
        type: string
      reason:
        type: string
      retrievable:
        type: boolean
      state:
        description: published | first_export | unavailable
        example: published
        type: string
      tag:
        example: v8
        type: string
    type: object
  handler.mergeAttemptResult:
    properties:
      attemptedAt:
        type: string
      attemptedBy:
        example: merger@armada.ai
        type: string
      error:
        description: Error is the attempt-level failure. Empty when every item applied.
        type: string
      results:
        description: |-
          Results is the per-item outcome, in the order applied. A partial merge is
          a real outcome, not an error state — what applied stays applied.
        items:
          $ref: '#/definitions/handler.mergeItemResult'
        type: array
    type: object
  handler.mergeItemResult:
    properties:
      applied:
        example: true
        type: boolean
      error:
        type: string
      orbId:
        example: alaska-dot:server-4FK8K44
        type: string
    type: object
  handler.pendingApprovalItem:
    properties:
      changeRequestId:
        description: |-
          ChangeRequestID is the request opened on the caller's behalf, pre-filled
          from this divergence entry.
        example: 4b1f0f7a-6f0c-4a1e-9a2e-2f1c7a0b1234
        type: string
      message:
        example: Accepting this divergence needs approval; a change request was opened.
        type: string
      status:
        description: |-
          Status is always "pending_approval" — a discriminator so a client can
          branch without inspecting which fields are present.
        example: pending_approval
        type: string
    type: object
  handler.previewResponse:
    properties:
      byType:
        additionalProperties:
          $ref: '#/definitions/graphdiff.Summary'
        type: object
      changes:
        items:
          $ref: '#/definitions/graphdiff.Change'
        type: array
      current:
        $ref: '#/definitions/handler.currentMeta'
      dataCenterName:
        example: colo-galleon
        type: string
      disclaimer:
        type: string
      lastPublishedVersion:
        $ref: '#/definitions/handler.lastPublishedMeta'
      orbId:
        example: colo:colo-galleon
        type: string
      summary:
        $ref: '#/definitions/graphdiff.Summary'
    type: object
  handler.putResolutionBody:
    properties:
      action:
        description: '"accept" | "reject" | "ignore"'
        type: string
    type: object
  handler.resolutionItem:
    properties:
      action:
        description: '"accept" | "reject" | "ignore"'
        type: string
      actor:
        type: string
      decidedAt:
        type: string
      id:
        type: string
    type: object
  handler.restoreJobResponse:
    properties:
      backupId:
        type: string
      backupKey:
        type: string
      completedAt:
        type: string
      createdAt:
        type: string
      createdBy:
        type: string
      error:
        type: string
      id:
        type: string
      log:
        type: string
      startedAt:
        type: string
      status:
        type: string
    type: object
  handler.restoreRequest:
    properties:
      backupId:
        description: BackupID is the UUID of the stored backup to restore from. Required.
        example: a1b2c3d4-0000-0000-0000-000000000000
        type: string
      confirmSchemaMismatch:
        description: |-
          ConfirmSchemaMismatch must be true to proceed when the backup's schema
          version differs from the running schema. false (default) makes such a
          restore fail fast rather than risk a mismatched load.
        example: false
        type: boolean
    required:
    - backupId
    type: object
  handler.statusResponse:
    properties:
      completedAt:
        type: string
      createdAt:
        type: string
      createdBy:
        type: string
      dataCenter:
        type: string
      error:
        type: string
      id:
        type: string
      phase:
        description: |-
          Phase surfaces the fine-grained step the atomic goroutine is on, for
          clients that want to render a per-step progress list. Coarse `status`
          stays authoritative for terminal-state gating. Values: pending,
          exporting, bundling, pushing, signing, completed, failed. Empty
          only if derivation raced with the initial insert.
        type: string
      published:
        type: boolean
      status:
        type: string
    type: object
  handler.triggerResponse:
    properties:
      id:
        type: string
      status:
        type: string
    type: object
  handler.updateRoleRequest:
    properties:
      role:
        type: string
    type: object
  handler.userItem:
    properties:
      createdAt:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      note:
        type: string
      preferredUsername:
        type: string
      role:
        type: string
    type: object
  handler.validationErrorResponse:
    properties:
      code:
        example: BAD_USER_INPUT
        type: string
      error:
        example: changeset is not valid
        type: string
      httpStatus:
        example: 400
        type: integer
      problems:
        items:
          $ref: '#/definitions/handler.changesetProblem'
        type: array
    type: object
  ocitype.ArtifactLayer:
    properties:
      digest:
        type: string
      isOrbitalNative:
        description: true for data.json.gz + schema.gz; false for anything bundler-added
        type: boolean
      mediaType:
        type: string
      producer:
        description: |-
          Producer is the friendly name of whatever produced this layer (e.g.
          "orbital" for the two graph layers, "configbundle-bundler" for layers
          returned by that bundler). Mirrors the OCI manifest annotation
          `com.armada.orbital.producer` written at push time. Empty for legacy
          artifacts published before producer attribution was introduced.
        type: string
      sizeBytes:
        type: integer
    type: object
info:
  contact: {}
  description: API-first, graph-native source of truth for modular data centers.
  title: Orbital API
  version: 0.0.0-dev
paths:
  /api/v1/approval-policies:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.approvalPolicyResponse'
            type: array
      summary: List approval policies
      tags:
      - approval-policies
    post:
      consumes:
      - application/json
      description: 'Opt-in: with no enabled policy, writes behave exactly as they
        do today.'
      parameters:
      - description: Policy
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.approvalPolicyBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.approvalPolicyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Create an approval policy
      tags:
      - approval-policies
  /api/v1/approval-policies/{id}:
    delete:
      parameters:
      - description: Policy ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Delete an approval policy
      tags:
      - approval-policies
    patch:
      consumes:
      - application/json
      parameters:
      - description: Policy ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to change
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.approvalPolicyBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.approvalPolicyResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Update an approval policy
      tags:
      - approval-policies
  /api/v1/approval-policies/resolve:
    get:
      description: Lets a client label its save button Save or Propose without re-implementing
        policy resolution.
      parameters:
      - description: Namespace
        in: query
        name: namespace
        required: true
        type: string
      - description: ConfigItem type
        in: query
        name: type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.approvalPolicyResolveResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Resolve the policy for a namespace and type
      tags:
      - approval-policies
  /api/v1/audit-log:
    get:
      description: |-
        Read-only, immutable audit trail of intent mutations, newest first.

        **Scope a query** by combining filters: `orbId` (repeatable, max 32) for a specific resource; `namespace` for a whole data center; `resource_type`/`operation_name` to narrow. To see everything under a server/cluster, fetch its subtree orbIds from the GraphQL Topology API and pass them as repeatable `orbId` params (there is no single "cluster" scope — a child mutation records the child's orbId, not the parent's).

        **Render a diff:** when an event is a clean single-entity update it carries a `changes` array (`[{field, before, after}]`) with metadata and DGraph UIDs already excluded — render it directly. When `changes` is absent (bulk add, create, or a multi-operation event), there is no field diff; fall back to showing `operations` + `resourceIds`. The raw `details` (with `before`/`variables`) is always included for callers that want it.

        Returns JSON by default; returns an HTML table fragment when the `HX-Request` header is present (used by orbital's own UI). See docs/api-cheatsheet.md § "Audit log".
      parameters:
      - description: Max results (default 100, max 500)
        in: query
        name: limit
        type: integer
      - description: Pagination offset
        in: query
        name: offset
        type: integer
      - collectionFormat: csv
        description: Filter by resource orbId (e.g. alaska-dot:GRTLY24). Repeatable
          (pass multiple), max 32 — matches events touching ANY of them.
        in: query
        items:
          type: string
        name: orbId
        type: array
      - description: Filter by namespace prefix (e.g. \
        in: query
        name: namespace
        type: string
      - description: RFC3339 lower bound (exclusive) on event timestamp
        in: query
        name: since
        type: string
      - description: RFC3339 upper bound (inclusive) on event timestamp
        in: query
        name: until
        type: string
      - description: Filter by resource ID
        in: query
        name: resource_id
        type: string
      - description: Filter by resource type (e.g. Server, DataCenter)
        in: query
        name: resource_type
        type: string
      - description: Filter to events containing this operation (exact, case-sensitive;
          stored form is verb-lowercased, e.g. updateVeleroBackup)
        in: query
        name: operation_name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.auditLogResponse'
      summary: List audit events
      tags:
      - audit
  /api/v1/backup:
