      - description: Artifact ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - text/html
      responses:
        "200":
          description: OK
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Get layers for an OCI artifact
      tags:
      - oci
  /api/v1/oci/public-key:
    get:
      description: Returns the PEM-encoded public key corresponding to the configured
