definitions:
  handler.artifactResponse:
    properties:
      bundlerError:
        type: string
      completedAt:
        type: string
      datacenterId:
        type: string
      datacenterName:
        type: string
      digest:
        type: string
      enriched:
        type: boolean
      error:
        type: string
      exportJobId:
        type: string
      id:
        type: integer
      initiatedAt:
        type: string
      layers:
        items:
          $ref: '#/definitions/ocitype.ArtifactLayer'
        type: array
      registry:
        type: string
      repository:
        type: string
      signed:
        type: boolean
      signingKeyFingerprint:
        type: string
      sizeBytes:
        type: integer
      status:
        type: string
      tag:
        type: string
    type: object
  handler.backupResponse:
    properties:
      checksum:
        type: string
      completedAt:
        type: string
      error:
        type: string
      id:
        type: string
      initiatedAt:
        type: string
      initiatedBy:
        type: string
      s3Key:
        type: string
      sizeBytes:
        type: integer
      status:
        type: string
      trigger:
        type: string
    type: object
  handler.entryItem:
    properties:
      dcOrbId:
        type: string
      entryOrbId:
        type: string
      field:
        type: string
      firstSeenAt:
        type: string
      id:
        type: string
      intendedValue:
        type: object
      lastSeenAt:
        type: string
      overrideValue:
        type: object
      resolution:
        allOf:
        - $ref: '#/definitions/handler.resolutionItem'
        description: Resolution is the current decision on this entry, if any. Nil
          when un-resolved.
      who:
        type: string
    type: object
  handler.putResolutionBody:
    properties:
      action:
        description: '"accept" | "reject" | "ignore"'
        type: string
    type: object
  handler.resolutionItem:
    properties:
      action:
        description: '"accept" | "reject" | "ignore"'
        type: string
      actor:
        type: string
      decidedAt:
        type: string
      id:
        type: string
    type: object
  handler.restoreJobResponse:
    properties:
      backupId:
        type: string
      backupKey:
        type: string
      completedAt:
        type: string
      createdAt:
        type: string
      createdBy:
        type: string
      error:
        type: string
      id:
        type: string
      log:
        type: string
      startedAt:
        type: string
      status:
        type: string
    type: object
  handler.statusResponse:
    properties:
      completedAt:
        type: string
      createdAt:
        type: string
      createdBy:
        type: string
      dataCenter:
        type: string
      error:
        type: string
      id:
        type: string
      published:
        type: boolean
      status:
        type: string
    type: object
  handler.triggerResponse:
    properties:
      id:
        type: string
      status:
        type: string
    type: object
  handler.updateRoleRequest:
    properties:
      role:
        type: string
    type: object
  handler.userItem:
    properties:
      createdAt:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      note:
        type: string
      preferredUsername:
        type: string
      role:
        type: string
    type: object
  ocitype.ArtifactLayer:
    properties:
      digest:
        type: string
      isOrbitalNative:
        description: true for data.json.gz + schema.gz; false for anything bundler-added
        type: boolean
      mediaType:
        type: string
      producer:
        description: |-
          Producer is the friendly name of whatever produced this layer (e.g.
          "orbital" for the two graph layers, "configbundle-bundler" for layers
          returned by that bundler). Mirrors the OCI manifest annotation
          `com.armada.orbital.producer` written at push time. Empty for legacy
          artifacts published before producer attribution was introduced.
        type: string
      sizeBytes:
        type: integer
    type: object
info:
  contact: {}
  description: API-first, graph-native source of truth for modular data centers.
  title: Orbital API
  version: 0.0.0-dev
paths:
  /api/v1/audit-log:
    get:
      description: Returns recorded mutation events. Supports limit/offset pagination
        and optional filtering by orbId, resource_type, resource_id, or operation_name.
        Returns JSON by default; returns an HTML table fragment when the HX-Request
        header is present.
      parameters:
      - description: Max results (default 100, max 500)
        in: query
        name: limit
        type: integer
      - description: Pagination offset
        in: query
        name: offset
        type: integer
      - description: Filter by resource orbId (e.g. alaska-dot:GRTLY24). Repeatable,
          max 32.
        in: query
        name: orbId
        type: string
      - description: Filter by namespace prefix (e.g. \
        in: query
        name: namespace
        type: string
      - description: RFC3339 lower bound (exclusive) on event timestamp
        in: query
        name: since
        type: string
      - description: RFC3339 upper bound (inclusive) on event timestamp
        in: query
        name: until
        type: string
      - description: Filter by resource ID
        in: query
        name: resource_id
        type: string
      - description: Filter by resource type (e.g. Server, DataCenter)
        in: query
        name: resource_type
        type: string
      - description: Filter by operation name (e.g. UpdateServer)
        in: query
        name: operation_name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: List audit events
      tags:
      - audit
  /api/v1/backup:
    post:
      description: Triggers an async DGraph backup to configured S3-compatible or
        Azure Blob storage. Returns immediately with a job ID. Returns 409 if a backup
        is already in progress.
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handler.triggerResponse'
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Trigger backup
      tags:
      - backup
  /api/v1/backup/jobs:
    get:
      description: Returns up to 50 backup records ordered by most recent first.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.backupResponse'
            type: array
      summary: List backups
      tags:
      - backup
  /api/v1/backup/jobs/{jobId}:
    delete:
      description: Deletes the backup record and its archive from storage. Returns
        409 if the backup is still running.
      parameters:
      - description: Backup job ID
        in: path
        name: jobId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete backup
      tags:
      - backup
    get:
      description: Returns the current status and metadata for a single backup job.
      parameters:
      - description: Backup job ID
        in: path
        name: jobId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.backupResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get backup status
      tags:
      - backup
  /api/v1/backup/jobs/{jobId}/download:
    get:
      description: Returns a presigned URL (valid 15 minutes) to download the completed
        backup archive. Returns 404 if the job is not completed or has no archive.
      parameters:
      - description: Backup job ID
        in: path
        name: jobId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Download backup
      tags:
      - backup
  /api/v1/backup/test-connection:
    post:
      description: 'Pings the configured backup storage backend (S3-compatible or
        Azure Blob). Returns JSON `{ok, error?}` by default, or an inline HTML span
        when `HX-Request: true` is set.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Test backup storage connection
      tags:
      - backup
  /api/v1/config-items/{type}/{id}:
    delete:
      description: |-
        Deletes a DataCenter or Server together with its dependent
        children. Bound to the UI delete modal's confirm action.
        Single-entity (non-cascading) deletes go through GraphQL.
      parameters:
      - description: Config item type
        enum:
        - DataCenter
        - Server
        in: path
        name: type
        required: true
        type: string
      - description: DGraph node id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: '{ \"deleted\": N }'
          schema:
            additionalProperties:
              type: integer
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Cascade-delete a config item (UI flow)
      tags:
      - config-items
  /api/v1/divergences:
    delete:
      parameters:
      - description: Data center orbId (e.g. colo:colo-galleon)
        in: query
        name: dcOrbId
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Clear all divergence state for a data center
      tags:
      - divergence
    get:
      parameters:
      - collectionFormat: csv
        description: Filter by resolution action; repeatable for OR
        in: query
        items:
          enum:
          - accept
          - reject
          - ignore
          type: string
        name: action
        type: array
      - description: Filter by dc_orb_id
        in: query
        name: dc
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.entryItem'
            type: array
      summary: List divergences with their resolution
      tags:
      - divergence
  /api/v1/divergences/{id}:
    delete:
      parameters:
      - description: Divergence entry UUID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Not stale — accept/reject/ignore instead
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Dismiss a stale divergence
      tags:
      - divergence
    get:
      parameters:
      - description: Divergence entry UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.entryItem'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get one divergence by ID
      tags:
      - divergence
  /api/v1/divergences/{id}/resolution:
    delete:
      parameters:
      - description: Divergence entry UUID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Clear a divergence resolution
      tags:
      - divergence
    put:
      consumes:
      - application/json
      parameters:
      - description: Divergence entry UUID
        in: path
        name: id
        required: true
        type: string
      - description: Decision payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.putResolutionBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.resolutionItem'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: MVCC conflict — intent changed since report
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Record a divergence resolution
      tags:
      - divergence
  /api/v1/export:
    post:
      consumes:
      - application/json
      description: Triggers an async atomic export of the data center's configuration
        subgraph. When download=false (default) AND OCI is configured, the export
        chains into an OCI publish and the zip is discarded on completion. When download=true
        (or OCI is not configured), the export runs in download-only mode and the
        zip is retained on disk for the client to fetch via GET /api/v1/export/jobs/{jobId}/download.
        Returns 202 with a job ID immediately; poll GET /api/v1/export/jobs/{jobId}
        until terminal state. Returns 409 if an export or restore is already in progress.
      parameters:
      - description: Export request
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handler.triggerResponse'
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Trigger subgraph export
      tags:
      - export
  /api/v1/export/jobs:
    get:
      description: Returns the 50 most recent export jobs ordered by creation time.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.statusResponse'
            type: array
      summary: List export jobs
      tags:
      - export
  /api/v1/export/jobs/{jobId}:
    get:
      description: Returns the current status of an export job.
      parameters:
      - description: Job ID (UUID)
        in: path
        name: jobId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.statusResponse'
        "404":
          description: Not Found
      summary: Get export job status
      tags:
      - export
  /api/v1/export/jobs/{jobId}/artifact:
    delete:
      description: Removes the retained zip for a download-flow export. The ExportJob
        row remains for audit; only the on-disk artifact and artifact_path are cleared.
        404 if job or artifact does not exist.
      parameters:
      - description: Job ID (UUID)
        in: path
        name: jobId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete export artifact
      tags:
      - export
  /api/v1/export/jobs/{jobId}/download:
    get:
      description: Downloads a zip containing data.json.gz + schema.gz. When bundlers
        are configured, also includes bundler-produced layers + layers.json — the
        exact format orb's /import/artifact accepts.
      parameters:
      - description: Job ID (UUID)
        in: path
        name: jobId
        required: true
        type: string
      produces:
      - application/zip
      responses:
        "200":
          description: OK
        "404":
          description: Not Found
        "502":
          description: Bad Gateway
      summary: Download export artifact
      tags:
      - export
  /api/v1/oci/artifacts:
    get:
      description: Returns the 100 most recent OCI artifacts ordered by publish time
        descending.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.artifactResponse'
            type: array
      summary: List OCI artifacts
      tags:
      - oci
  /api/v1/oci/artifacts/{id}:
    get:
      description: Returns a single OCI artifact record by ID.
      parameters:
      - description: Artifact ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.artifactResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get OCI artifact
      tags:
      - oci
  /api/v1/oci/artifacts/{id}/layers:
    get:
      description: Returns an HTML fragment rendering the layers modal for the given
        artifact.
      parameters:
      - description: Artifact ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - text/html
      responses:
        "200":
          description: OK
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get layers for an OCI artifact
      tags:
      - oci
  /api/v1/oci/public-key:
    get:
      description: Returns the PEM-encoded public key corresponding to the configured
        OCI signing key. Used by edge consumers to verify artifact signatures.
      produces:
      - application/x-pem-file
      responses:
        "200":
          description: OK
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get OCI signing public key
      tags:
      - oci
  /api/v1/oci/test-connection:
    post:
      description: 'Pings the configured OCI registry to verify credentials and reachability.
        Returns {"ok": true} on success or {"ok": false, "error": "..."} on failure.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Test OCI registry connection
      tags:
      - oci
  /api/v1/restore:
    post:
      consumes:
      - application/json
      description: Restores DGraph blue from a stored backup. Blocked if any backup,
        export, or restore job is in progress.
      parameters:
      - description: backupId (UUID)
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handler.triggerResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Trigger a DGraph restore
      tags:
      - backup
  /api/v1/restore/jobs:
    get:
      description: Returns up to 50 restore jobs ordered by most recent first.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.restoreJobResponse'
            type: array
      summary: List restore jobs
      tags:
      - backup
  /api/v1/restore/jobs/{jobId}:
    get:
      description: Returns the status of a specific restore job.
      parameters:
      - description: Restore job ID
        in: path
        name: jobId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.restoreJobResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get restore job status
      tags:
      - backup
  /api/v1/users:
    get:
      description: Returns all users in the orbital user table. Admin only.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List users
      tags:
      - users
  /api/v1/users/{id}/role:
    put:
      consumes:
      - application/json
      description: Changes a user's role. Accepts `readonly`, `dev`, or `admin`. Admin
        only. Returns 409 if changing the role would leave zero admins (last-admin
        guard).
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: New role
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.updateRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.userItem'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update user role
      tags:
      - users
  /graphql:
    post:
      consumes:
      - application/json
      description: 'POST: proxies GraphQL queries and mutations to DGraph. GET: serves
        the GraphiQL explorer UI.'
      parameters:
      - description: GraphQL request body
        example: '"{\"query\": \"{ queryDataCenter { id name } }\"}"'
        in: body
        name: body
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: GraphQL endpoint
      tags:
      - graphql
swagger: "2.0"
tags:
- name: audit
- name: backup
- name: config-items
- name: divergence
- name: export
- name: graphql
- name: oci
- name: users
