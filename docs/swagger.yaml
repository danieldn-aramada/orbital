  /api/v1/change-requests:
    get:
      description: Filters compose. `mine` and `awaiting_review` are caller-relative;
        `orbId` matches any request whose changeset touches that entity, at any position.
        `status=active` means not-terminal (open plus approved) — the filter to use
        for "does this entity have a change in flight", since `approved` is derived
        and `status=open` excludes it.
      parameters:
      - description: open, approved, active (open+approved), rejected, merged or closed
        in: query
        name: status
        type: string
      - description: Namespace
        in: query
        name: namespace
        type: string
      - description: Author email
        in: query
        name: author
        type: string
      - description: Only requests this caller authored
        in: query
        name: mine
        type: boolean
      - description: Only requests this caller can still review
        in: query
        name: awaiting_review
        type: boolean
      - description: Only requests touching this entity
        in: query
        name: orbId
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.changeRequestListResponse'
      summary: List change requests
      tags:
      - change-requests
    post:
      consumes:
      - application/json
      description: Validates the changeset against the deployed schema and the current
        graph, captures the intent it is written against, and opens it for review.
        Every problem is reported at once.
      parameters:
      - description: Change request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.createChangeRequestBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.changeRequestResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.validationErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Open a change request
      tags:
      - change-requests
  /api/v1/change-requests/{id}:
    get:
      parameters:
      - description: Change request ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.changeRequestResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Get a change request
      tags:
      - change-requests
    patch:
      consumes:
      - application/json
      description: Changing the changeset re-captures the intent it is written against,
        which stops the existing approvals from counting.
      parameters:
      - description: Change request ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to change
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.amendChangeRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.changeRequestResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.validationErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Amend an open change request
      tags:
      - change-requests
  /api/v1/change-requests/{id}/approve:
    post:
      consumes:
      - application/json
      description: Stamped with the intent it was cast against. Approving a stale
        request is how you re-review after the base moved.
      parameters:
      - description: Change request ID
        in: path
        name: id
        required: true
        type: string
      - description: Reviewer comment
        in: body
        name: body
        schema:
