definitions:
  handler.artifactResponse:
    properties:
      bundlerError:
        type: string
      completedAt:
        type: string
      datacenterId:
        type: string
      datacenterName:
        type: string
      digest:
        type: string
      enriched:
        type: boolean
      error:
        type: string
      exportJobId:
        type: string
      id:
        type: integer
      initiatedAt:
        type: string
      layers:
        items:
          $ref: '#/definitions/ocitype.ArtifactLayer'
        type: array
      registry:
        type: string
      repository:
        type: string
      signed:
        type: boolean
      signingKeyFingerprint:
        type: string
      sizeBytes:
        type: integer
      status:
        type: string
      tag:
        type: string
    type: object
  handler.auditLogResponse:
    properties:
      events:
        items:
          $ref: '#/definitions/handler.eventItem'
        type: array
      total:
        description: Total is the count of events matching the filters, ignoring limit/offset.
        example: 42
        type: integer
    type: object
  handler.backupRequest:
    properties:
      trigger:
        description: |-
          Trigger records what initiated the backup: "manual" (default) or
          "scheduled". Optional — an empty body is treated as "manual".
        example: manual
        type: string
    type: object
  handler.backupResponse:
    properties:
      checksum:
        type: string
      completedAt:
        type: string
      error:
        type: string
      id:
        type: string
      initiatedAt:
        type: string
      initiatedBy:
        type: string
      s3Key:
        type: string
      sizeBytes:
        type: integer
      status:
        type: string
      trigger:
        type: string
    type: object
  handler.entryItem:
    properties:
      dcOrbId:
        type: string
      entryOrbId:
        type: string
      field:
        type: string
      firstSeenAt:
        type: string
      id:
        type: string
      intendedValue:
        type: object
      lastSeenAt:
        type: string
      overrideValue:
        type: object
      resolution:
        allOf:
        - $ref: '#/definitions/handler.resolutionItem'
        description: Resolution is the current decision on this entry, if any. Nil
          when un-resolved.
      who:
        type: string
    type: object
  handler.errorResponse:
    properties:
      code:
        example: FORBIDDEN
        type: string
      docUrl:
        type: string
      error:
        example: dev or admin role required for mutations
        type: string
      hint:
        example: Ask an admin to grant you the dev role.
        type: string
      httpStatus:
        example: 403
        type: integer
    type: object
  handler.eventItem:
    properties:
      actor:
        example: asharma@armada.ai
        type: string
      changes:
        description: |-
          Changes is the pre-computed field-level diff. **Present ONLY for a clean
          single-entity update** (omitted otherwise via omitempty) — so its presence
          is the client's signal that a field diff is available; no need to inspect
          operations/before. Server-managed metadata (version/updatedAt/updatedBy/…)
          and DGraph UIDs are already excluded. Same data the UI's colored diff renders.
        items:
          $ref: '#/definitions/handler.fieldChange'
        type: array
      details:
        description: raw {operationName, query, variables, before}
        type: object
      eventCategory:
        description: data | management | auth
        example: data
        type: string
      id:
        example: 3d6bb15f-8c4c-45f0-8a6c-939b6f9cc512
        type: string
      operations:
        description: DGraph mutation fields, e.g. ["updateVeleroBackup"]
        items:
          type: string
        type: array
      resourceIds:
        description: orbIds touched
        items:
          type: string
        type: array
      resourceTypes:
        description: ConfigItem types touched, e.g. ["VeleroBackup"]
        items:
          type: string
        type: array
      timestamp:
        example: "2026-07-29T17:26:55Z"
        type: string
    type: object
  handler.exportRequest:
    properties:
      download:
        description: |-
          Download selects the mode. false (default) exports and publishes to OCI,
          discarding the zip on completion. true exports only and retains the zip
          for GET /api/v1/export/jobs/{jobId}/download.
        example: false
        type: boolean
      orbId:
        description: OrbID identifies the data center to export, in "namespace:name"
          form. Required.
        example: alaska:dc-01
        type: string
    required:
    - orbId
    type: object
  handler.fieldChange:
    properties:
      after:
        description: new value (e.g. 15)
        type: object
      before:
        description: old value (e.g. 7)
        type: object
      field:
        example: retentionDays
        type: string
    type: object
  handler.putResolutionBody:
    properties:
      action:
        description: '"accept" | "reject" | "ignore"'
        type: string
    type: object
  handler.resolutionItem:
    properties:
      action:
        description: '"accept" | "reject" | "ignore"'
        type: string
      actor:
        type: string
      decidedAt:
        type: string
      id:
        type: string
    type: object
  handler.restoreJobResponse:
    properties:
      backupId:
        type: string
      backupKey:
        type: string
      completedAt:
        type: string
      createdAt:
        type: string
      createdBy:
        type: string
      error:
        type: string
      id:
        type: string
      log:
        type: string
      startedAt:
        type: string
      status:
        type: string
    type: object
  handler.restoreRequest:
    properties:
      backupId:
        description: BackupID is the UUID of the stored backup to restore from. Required.
        example: a1b2c3d4-0000-0000-0000-000000000000
        type: string
      confirmSchemaMismatch:
        description: |-
          ConfirmSchemaMismatch must be true to proceed when the backup's schema
          version differs from the running schema. false (default) makes such a
          restore fail fast rather than risk a mismatched load.
        example: false
        type: boolean
    required:
    - backupId
    type: object
  handler.statusResponse:
    properties:
      completedAt:
        type: string
      createdAt:
        type: string
      createdBy:
        type: string
      dataCenter:
        type: string
      error:
        type: string
      id:
        type: string
      phase:
        description: |-
          Phase surfaces the fine-grained step the atomic goroutine is on, for
          clients that want to render a per-step progress list. Coarse `status`
          stays authoritative for terminal-state gating. Values: pending,
          exporting, bundling, pushing, signing, completed, failed. Empty
          only if derivation raced with the initial insert.
        type: string
      published:
        type: boolean
      status:
        type: string
    type: object
  handler.triggerResponse:
    properties:
      id:
        type: string
      status:
        type: string
    type: object
  handler.updateRoleRequest:
    properties:
      role:
        type: string
    type: object
  handler.userItem:
    properties:
      createdAt:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      note:
        type: string
      preferredUsername:
        type: string
      role:
        type: string
    type: object
  ocitype.ArtifactLayer:
    properties:
      digest:
        type: string
      isOrbitalNative:
        description: true for data.json.gz + schema.gz; false for anything bundler-added
        type: boolean
      mediaType:
        type: string
      producer:
        description: |-
          Producer is the friendly name of whatever produced this layer (e.g.
          "orbital" for the two graph layers, "configbundle-bundler" for layers
          returned by that bundler). Mirrors the OCI manifest annotation
          `com.armada.orbital.producer` written at push time. Empty for legacy
          artifacts published before producer attribution was introduced.
        type: string
      sizeBytes:
        type: integer
    type: object
info:
  contact: {}
  description: API-first, graph-native source of truth for modular data centers.
  title: Orbital API
  version: 0.0.0-dev
paths:
  /api/v1/audit-log:
    get:
      description: |-
        Read-only, immutable audit trail of intent mutations, newest first.

        **Scope a query** by combining filters: `orbId` (repeatable, max 32) for a specific resource; `namespace` for a whole data center; `resource_type`/`operation_name` to narrow. To see everything under a server/cluster, fetch its subtree orbIds from the GraphQL Topology API and pass them as repeatable `orbId` params (there is no single "cluster" scope — a child mutation records the child's orbId, not the parent's).

        **Render a diff:** when an event is a clean single-entity update it carries a `changes` array (`[{field, before, after}]`) with metadata and DGraph UIDs already excluded — render it directly. When `changes` is absent (bulk add, create, or a multi-operation event), there is no field diff; fall back to showing `operations` + `resourceIds`. The raw `details` (with `before`/`variables`) is always included for callers that want it.

        Returns JSON by default; returns an HTML table fragment when the `HX-Request` header is present (used by orbital's own UI). See docs/api-cheatsheet.md § "Audit log".
      parameters:
      - description: Max results (default 100, max 500)
        in: query
        name: limit
        type: integer
      - description: Pagination offset
        in: query
        name: offset
        type: integer
      - collectionFormat: csv
        description: Filter by resource orbId (e.g. alaska-dot:GRTLY24). Repeatable
          (pass multiple), max 32 — matches events touching ANY of them.
        in: query
        items:
          type: string
        name: orbId
        type: array
      - description: Filter by namespace prefix (e.g. \
        in: query
        name: namespace
        type: string
      - description: RFC3339 lower bound (exclusive) on event timestamp
        in: query
        name: since
        type: string
      - description: RFC3339 upper bound (inclusive) on event timestamp
        in: query
        name: until
        type: string
      - description: Filter by resource ID
        in: query
        name: resource_id
        type: string
      - description: Filter by resource type (e.g. Server, DataCenter)
        in: query
        name: resource_type
        type: string
      - description: Filter to events containing this operation (exact, case-sensitive;
          stored form is verb-lowercased, e.g. updateVeleroBackup)
        in: query
        name: operation_name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.auditLogResponse'
      summary: List audit events
      tags:
      - audit
  /api/v1/backup:
    post:
      consumes:
      - application/json
      description: Triggers an async DGraph backup to configured S3-compatible or
        Azure Blob storage. Returns immediately with a job ID. Returns 409 if a backup
        is already in progress.
      parameters:
      - description: Backup request (optional; defaults trigger=manual)
        in: body
        name: body
        schema:
          $ref: '#/definitions/handler.backupRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handler.triggerResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Trigger backup
      tags:
      - backup
  /api/v1/backup/jobs:
    get:
      description: Returns up to 50 backup records ordered by most recent first.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.backupResponse'
            type: array
      summary: List backups
      tags:
      - backup
  /api/v1/backup/jobs/{jobId}:
    delete:
      description: Deletes the backup record and its archive from storage. Returns
        409 if the backup is still running.
      parameters:
      - description: Backup job ID
        in: path
        name: jobId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Delete backup
      tags:
      - backup
    get:
      description: Returns the current status and metadata for a single backup job.
      parameters:
      - description: Backup job ID
        in: path
        name: jobId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.backupResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Get backup status
      tags:
      - backup
  /api/v1/backup/jobs/{jobId}/download:
    get:
      description: Returns a presigned URL (valid 15 minutes) to download the completed
        backup archive. Returns 404 if the job is not completed or has no archive.
      parameters:
      - description: Backup job ID
        in: path
        name: jobId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Download backup
      tags:
      - backup
  /api/v1/backup/test-connection:
    post:
      description: 'Pings the configured backup storage backend (S3-compatible or
        Azure Blob). Returns JSON `{ok, error?}` by default, or an inline HTML span
        when `HX-Request: true` is set.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Test backup storage connection
      tags:
      - backup
  /api/v1/config-items/{type}/{id}:
    delete:
      description: |-
        Deletes a DataCenter or Server together with its dependent
        children. Bound to the UI delete modal's confirm action.
        Single-entity (non-cascading) deletes go through GraphQL.
      parameters:
      - description: Config item type
        enum:
        - DataCenter
        - Server
        in: path
        name: type
        required: true
        type: string
      - description: DGraph node id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: '{ \"deleted\": N }'
          schema:
            additionalProperties:
              type: integer
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Cascade-delete a config item (UI flow)
      tags:
      - config-items
  /api/v1/divergences:
    delete:
      parameters:
      - description: Data center orbId (e.g. colo:colo-galleon)
        in: query
        name: dcOrbId
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Clear all divergence state for a data center
      tags:
      - divergence
    get:
      parameters:
      - collectionFormat: csv
        description: Filter by resolution action; repeatable for OR
        in: query
        items:
          enum:
          - accept
          - reject
          - ignore
          type: string
        name: action
        type: array
      - description: Filter by dc_orb_id
        in: query
        name: dc
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.entryItem'
            type: array
      summary: List divergences with their resolution
      tags:
      - divergence
  /api/v1/divergences/{id}:
    delete:
      parameters:
      - description: Divergence entry UUID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "409":
          description: Not stale — accept/reject/ignore instead
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Dismiss a stale divergence
      tags:
      - divergence
    get:
      parameters:
      - description: Divergence entry UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.entryItem'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Get one divergence by ID
      tags:
      - divergence
  /api/v1/divergences/{id}/resolution:
    delete:
      parameters:
      - description: Divergence entry UUID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Clear a divergence resolution
      tags:
      - divergence
    put:
      consumes:
      - application/json
      parameters:
      - description: Divergence entry UUID
        in: path
        name: id
        required: true
        type: string
      - description: Decision payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.putResolutionBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.resolutionItem'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "409":
          description: MVCC conflict — intent changed since report
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Record a divergence resolution
      tags:
      - divergence
  /api/v1/export:
    post:
      consumes:
      - application/json
      description: Triggers an async atomic export of the data center's configuration
        subgraph. When download=false (default) AND OCI is configured, the export
        chains into an OCI publish and the zip is discarded on completion. When download=true
        (or OCI is not configured), the export runs in download-only mode and the
        zip is retained on disk for the client to fetch via GET /api/v1/export/jobs/{jobId}/download.
        Returns 202 with a job ID immediately; poll GET /api/v1/export/jobs/{jobId}
        until terminal state. Returns 409 if an export or restore is already in progress.
      parameters:
      - description: Export request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.exportRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handler.triggerResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Trigger subgraph export
      tags:
      - export
  /api/v1/export/jobs:
    get:
      description: Returns the 50 most recent export jobs ordered by creation time.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.statusResponse'
            type: array
      summary: List export jobs
      tags:
      - export
  /api/v1/export/jobs/{jobId}:
    get:
      description: Returns the current status of an export job.
      parameters:
      - description: Job ID (UUID)
        in: path
        name: jobId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.statusResponse'
        "404":
          description: Not Found
      summary: Get export job status
      tags:
      - export
  /api/v1/export/jobs/{jobId}/artifact:
    delete:
      description: Removes the retained zip for a download-flow export. The ExportJob
        row remains for audit; only the on-disk artifact and artifact_path are cleared.
        404 if job or artifact does not exist.
      parameters:
      - description: Job ID (UUID)
        in: path
        name: jobId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Delete export artifact
      tags:
      - export
  /api/v1/export/jobs/{jobId}/download:
    get:
      description: Downloads a zip containing data.json.gz + schema.gz. When bundlers
        are configured, also includes bundler-produced layers + layers.json — the
        exact format orb's /import/artifact accepts.
      parameters:
      - description: Job ID (UUID)
        in: path
        name: jobId
        required: true
        type: string
      produces:
      - application/zip
      responses:
        "200":
          description: OK
        "404":
          description: Not Found
        "502":
          description: Bad Gateway
      summary: Download export artifact
      tags:
      - export
  /api/v1/oci/artifacts:
    get:
      description: Returns the 100 most recent OCI artifacts ordered by publish time
        descending.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.artifactResponse'
            type: array
      summary: List OCI artifacts
      tags:
      - oci
  /api/v1/oci/artifacts/{id}:
    get:
      description: Returns a single OCI artifact record by ID.
      parameters:
      - description: Artifact ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.artifactResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Get OCI artifact
      tags:
      - oci
  /api/v1/oci/artifacts/{id}/layers:
    get:
      description: Returns an HTML fragment rendering the layers modal for the given
        artifact.
      parameters:
      - description: Artifact ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - text/html
      responses:
        "200":
          description: OK
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Get layers for an OCI artifact
      tags:
      - oci
  /api/v1/oci/public-key:
    get:
      description: Returns the PEM-encoded public key corresponding to the configured
        OCI signing key. Used by edge consumers to verify artifact signatures.
      produces:
      - application/x-pem-file
      responses:
        "200":
          description: OK
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Get OCI signing public key
      tags:
      - oci
  /api/v1/oci/test-connection:
    post:
      description: 'Pings the configured OCI registry to verify credentials and reachability.
        Returns {"ok": true} on success or {"ok": false, "error": "..."} on failure.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Test OCI registry connection
      tags:
      - oci
  /api/v1/restore:
    post:
      consumes:
      - application/json
      description: Restores DGraph blue from a stored backup. Blocked if any backup,
        export, or restore job is in progress.
      parameters:
      - description: Restore request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.restoreRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handler.triggerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Trigger a DGraph restore
      tags:
      - backup
  /api/v1/restore/jobs:
    get:
      description: Returns up to 50 restore jobs ordered by most recent first.
