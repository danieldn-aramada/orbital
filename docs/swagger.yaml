  /api/v1/export:
    post:
      consumes:
      - application/json
      description: Triggers an async atomic export of the data center's configuration
        subgraph. When download=false (default) AND OCI is configured, the export
        chains into an OCI publish and the zip is discarded on completion. When download=true
        (or OCI is not configured), the export runs in download-only mode and the
        zip is retained on disk for the client to fetch via GET /api/v1/export/jobs/{jobId}/download.
        Returns 202 with a job ID immediately; poll GET /api/v1/export/jobs/{jobId}
        until terminal state. Returns 409 if an export or restore is already in progress,
        or if expectedContentHash is supplied and the desired state changed since
        that preview (guarded Apply).
      parameters:
      - description: Export request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.exportRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handler.triggerResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Trigger subgraph export
      tags:
      - export
  /api/v1/export/compare:
    get:
      description: Returns the desired-state delta between two published OCI artifacts
        of the same data center. Read-only; both artifacts are pulled by immutable
        digest. Not an apply-forecast.
      parameters:
      - description: Artifact ID to diff FROM (the earlier side)
        in: query
        name: from
        required: true
        type: integer
      - description: Artifact ID to diff TO (the later side)
        in: query
        name: to
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.compareResponse'
      summary: Compare two published artifacts
      tags:
      - export
  /api/v1/export/jobs:
    get:
      description: Returns the 50 most recent export jobs ordered by creation time.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.statusResponse'
            type: array
      summary: List export jobs
      tags:
      - export
  /api/v1/export/jobs/{jobId}:
    get:
      description: Returns the current status of an export job.
      parameters:
      - description: Job ID (UUID)
        in: path
        name: jobId
        required: true
