  /api/v1/oci/artifacts:
    get:
      description: Returns published OCI artifacts, most recent first. Combine `dc`
        + `status=completed` + `limit=1` to read the latest published version for
        a data center — the response carries `tag`, `digest` and `completedAt`. **Compare
        on `digest`, not `tag`:** the tag sequence is per OCI repository and the repository
        name derives from the data center's editable name, so renaming a data center
        restarts the sequence at v1 for the same orbId.
      parameters:
      - description: Filter by data center orbId (e.g. colo:colo-galleon). Matches
          RegistryArtifact.datacenter_id, which stores the orbId.
        in: query
        name: dc
        type: string
